<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Семейное дерево · Лысковы и Максимовы</title>
<style>
  :root { --ink:#243337; --muted:#718184; --line:#d7e1dc; --bg:#f5f7f3; --white:#fffdf8; --green:#174d43; --green2:#327568; --ochre:#a76c42; --shadow:0 12px 36px rgba(20,49,44,.12); }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif; }
  button,input { font:inherit; }
  button { cursor:pointer; }
  .app { display:grid; grid-template-columns:338px minmax(0,1fr); height:100dvh; min-height:550px; }
  .side { background:var(--white); border-right:1px solid var(--line); display:flex; flex-direction:column; z-index:3; overflow:hidden; }
  .brand { padding:25px 23px 16px; }
  .eyebrow { color:var(--green2); font-size:10px; font-weight:800; letter-spacing:.15em; text-transform:uppercase; }
  h1 { font-size:25px; letter-spacing:-.045em; line-height:1.05; margin:9px 0 8px; font-family:Georgia,serif; font-weight:500; }
  .subtitle { color:var(--muted); line-height:1.5; font-size:12px; }
  .stats { display:flex; gap:7px; margin-top:17px; }
  .stat { background:#edf2ec; border-radius:10px; padding:9px 11px; flex:1; }
  .stat strong { display:block; color:var(--green); font-size:18px; }
  .stat span { font-size:10px; color:var(--muted); }
  .search-area { padding:4px 23px 16px; position:relative; }
  .search { width:100%; outline:0; border:1px solid var(--line); border-radius:11px; padding:11px 13px; background:white; color:var(--ink); font-size:13px; }
  .search:focus { border-color:var(--green2); box-shadow:0 0 0 3px #dcece5; }
  .results { position:absolute; left:23px; right:23px; top:50px; background:white; border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); max-height:290px; overflow:auto; display:none; z-index:9; padding:5px; }
  .results.show { display:block; }
  .result { display:block; width:100%; border:0; background:transparent; text-align:left; padding:9px 10px; border-radius:7px; color:var(--ink); font-size:12px; }
  .result:hover,.result:focus { background:#eef4ee; }
  .result small { display:block; color:var(--muted); margin-top:2px; }
  .details { overflow-y:auto; padding:8px 23px 24px; flex:1; }
  .details h2 { font-family:Georgia,serif; font-weight:500; font-size:23px; line-height:1.15; margin:8px 0 8px; }
  .profile-head { display:flex; align-items:flex-start; justify-content:space-between; gap:8px; }
  .profile-sub { color:var(--muted); font-size:12px; line-height:1.5; margin-bottom:18px; }
  .mini-label { text-transform:uppercase; font-size:10px; font-weight:800; letter-spacing:.12em; color:var(--muted); margin:18px 0 7px; }
  .rel { width:100%; display:flex; align-items:center; justify-content:space-between; text-align:left; border:1px solid #e4eae5; background:#fff; color:var(--ink); padding:10px 11px; border-radius:10px; margin:5px 0; font-size:12px; }
  .rel:hover { border-color:#8baea0; background:#f7faf6; }
  .rel small { color:var(--muted); font-size:10px; }
  .empty { color:#98a29e; font-size:12px; margin:7px 0; }
  .side-foot { padding:12px 23px 17px; border-top:1px solid var(--line); font-size:10px; color:var(--muted); line-height:1.5; }
  .list-button { border:0; padding:0; color:var(--green); background:none; text-decoration:underline; font-size:11px; }
  .main { position:relative; min-width:0; display:flex; flex-direction:column; }
  .toolbar { padding:15px 22px; display:flex; gap:12px; flex-wrap:wrap; align-items:center; justify-content:space-between; border-bottom:1px solid var(--line); background:rgba(255,255,255,.8); z-index:2; }
  .toolbar-left,.toolbar-right { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .seg { display:flex; background:#e9efea; border-radius:10px; padding:3px; }
  .seg button { border:0; border-radius:8px; background:none; padding:8px 12px; color:#57706b; font-size:12px; font-weight:650; }
  .seg button.active { background:white; color:var(--green); box-shadow:0 1px 5px #183f351c; }
  .control { border:1px solid var(--line); background:white; border-radius:9px; padding:8px 11px; color:var(--green); font-size:12px; min-height:34px; }
  .control:hover { border-color:#8baea0; }
  .depth { color:var(--muted); font-size:11px; white-space:nowrap; }
  .viewport { flex:1; position:relative; overflow:hidden; cursor:grab; touch-action:none; background-color:#f7f8f4; background-image:radial-gradient(#dbe4dd 0.7px,transparent 0.7px); background-size:22px 22px; }
  .viewport.dragging { cursor:grabbing; }
  .stage { position:absolute; top:0; left:0; transform-origin:0 0; }
  .lines { position:absolute; inset:0; overflow:visible; pointer-events:none; }
  .lines path { fill:none; stroke:#b8cbc2; stroke-width:1.7; }
  .person { position:absolute; width:188px; min-height:82px; text-align:left; border:1px solid #dce6dd; border-left:4px solid #8fa9a1; border-radius:12px; background:white; padding:12px 12px 10px; box-shadow:0 3px 10px #1b453213; color:var(--ink); transition:box-shadow .15s,border-color .15s; }
  .person:hover { box-shadow:0 8px 20px #19453630; border-color:#7cab9a; }
  .person.female { border-left-color:#bd9278; }
  .person.focus { border-left-color:#174d43; background:#174d43; color:white; box-shadow:0 10px 25px #1b463b3a; }
  .person .name { display:block; font-size:12px; font-weight:700; line-height:1.3; overflow-wrap:anywhere; }
  .person .years { display:block; font-size:10px; color:#758681; margin-top:7px; }
  .person.focus .years { color:#c7ddd0; }
  .person .dot { float:right; opacity:.55; }
  .hint { position:absolute; bottom:15px; left:18px; right:18px; text-align:center; font-size:11px; color:#798984; pointer-events:none; }
  .modal { position:fixed; inset:0; z-index:20; background:#102b2880; display:none; align-items:center; justify-content:center; padding:16px; }
  .modal.show { display:flex; }
  .dialog { background:var(--white); border-radius:16px; width:min(600px,100%); max-height:min(85vh,780px); display:flex; flex-direction:column; box-shadow:var(--shadow); padding:22px; }
  .dialog-top { display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .dialog h2 { margin:0 0 14px; font-family:Georgia,serif; font-weight:500; }
  .all-list { overflow:auto; margin-top:12px; border-top:1px solid var(--line); }
  .all-list button { width:100%; display:flex; justify-content:space-between; gap:10px; padding:10px 5px; border:0; border-bottom:1px solid #e9eee9; background:transparent; color:var(--ink); text-align:left; font-size:12px; }
  .all-list button:hover { color:var(--green2); background:#f3f7f2; }
  .all-list small { color:var(--muted); white-space:nowrap; }
  @media(max-width:760px) { .app { grid-template-columns:1fr; grid-template-rows:auto minmax(400px,1fr); height:100dvh; } .side { max-height:260px; border-right:0; border-bottom:1px solid var(--line); } .brand { padding:12px 16px 4px; } h1 { font-size:20px; margin:3px 0; } .subtitle,.stats,.side-foot { display:none; } .search-area { padding:4px 16px 8px; } .results { left:16px; right:16px; top:46px; } .details { padding:0 16px 8px; } .details h2 { font-size:17px; margin:3px 0; } .profile-sub { margin-bottom:4px; } .mini-label,.rel,.empty { display:none; } .toolbar { padding:8px; gap:7px; } .seg button { padding:7px 9px; } .control { padding:7px 8px; } .hint { bottom:8px; } }
</style>
</head>

<script>
(() => {
  'use strict';
  const data = JSON.parse(document.getElementById('treeData').textContent);
  const people = new Map(data.people.map(p => [p.id,p]));
  const families = new Map(data.families.map(f => [f.id,f]));
  const $ = id => document.getElementById(id);
  const E = (tag, cls, text) => { const e = document.createElement(tag); if(cls)e.className=cls; if(text!==undefined)e.textContent=text; return e; };
  const rootId = people.has('I500003') ? 'I500003' : data.people[0].id;
  let selected = rootId, mode = 'all', depth = 4, scale = 1, tx = 0, ty = 0, width = 0, height = 0;
  const CARD_W = 188, CARD_H = 82, DX = 216, DY = 154;
  const year = date => (date || '').match(/\b(?:1[6-9]|20)\d{2}\b/)?.[0] || '';
  const label = p => p?.name || 'Имя неизвестно';
  const life = p => {
    if(!p)return '';
    const b=year(p.birth), d=year(p.death);
    return b && d ? `${b}–${d}` : b ? `р. ${b}` : d ? `ум. ${d}` : '';
  };
  const sorted = ids => [...new Set(ids.filter(id => people.has(id)))].sort((a,b)=>label(people.get(a)).localeCompare(label(people.get(b)),'ru'));
  $('peopleCount').textContent=data.people.length;
  $('familyCount').textContent=data.families.length;

  function parentIds(p) {
    const f=families.get(p?.parentFamily);
    return f ? [f.father,f.mother].filter(id=>id && people.has(id)) : [];
  }
  function childIds(p) {
    return [...new Set((p?.families||[]).flatMap(id=>families.get(id)?.children||[]))].filter(id=>people.has(id));
  }
  function partnerIds(p) {
    return sorted((p?.families||[]).map(id=>families.get(id)).filter(Boolean).flatMap(f=>[f.father,f.mother].filter(id=>id && id!==p.id)));
  }
  function buildAllGraph() {
    // Spouses share a row; every child is placed exactly one row below its parents.
    const adj=new Map(data.people.map(p=>[p.id,[]]));
    for(const f of data.families){
      const parents=[f.father,f.mother].filter(id=>people.has(id));
      for(const p of parents){
        for(const q of parents)if(q!==p)adj.get(p).push([q,0]);
        for(const c of f.children)if(people.has(c)){
          adj.get(p).push([c,1]);adj.get(c).push([p,-1]);
        }
      }
    }
    const rank=new Map([[rootId,0]]), queue=[rootId];
    for(let i=0;i<queue.length;i++)for(const [id,delta] of adj.get(queue[i])){
      if(!rank.has(id)){rank.set(id,rank.get(queue[i])+delta);queue.push(id);}
    }
    // Preserve disconnected records too, should the GEDCOM change later.
    for(const p of data.people)if(!rank.has(p.id))rank.set(p.id,0);
    const groupParent=new Map(data.people.map(p=>[p.id,p.id]));
    function find(id){while(groupParent.get(id)!==id)id=groupParent.get(id);return id;}
    function union(a,b){a=find(a);b=find(b);if(a!==b)groupParent.set(b,a);}
    for(const f of data.families)if(f.father&&f.mother&&rank.get(f.father)===rank.get(f.mother))union(f.father,f.mother);
    const groups=new Map();
    for(const p of data.people){const id=find(p.id);if(!groups.has(id))groups.set(id,{id,rank:rank.get(p.id),members:[]});groups.get(id).members.push(p.id);}
    for(const g of groups.values())g.members.sort((a,b)=>label(people.get(a)).localeCompare(label(people.get(b)),'ru'));
    const rows=new Map();
    for(const g of groups.values()){if(!rows.has(g.rank))rows.set(g.rank,[]);rows.get(g.rank).push(g);}
    const levels=[...rows.keys()].sort((a,b)=>a-b);
    for(const row of rows.values())row.sort((a,b)=>label(people.get(a.members[0])).localeCompare(label(people.get(b.members[0])),'ru'));
    // Repeated barycentre passes keep close relatives near one another.
    for(let pass=0;pass<8;pass++){
      const position=new Map();
      for(const row of rows.values())row.forEach((g,index)=>g.members.forEach(id=>position.set(id,index)));
      for(const level of (pass%2 ? [...levels].reverse() : levels)){
        const row=rows.get(level);
        const scored=row.map((g,index)=>{
          const neighbors=g.members.flatMap(id=>adj.get(id).filter(([other,d])=>d===(pass%2?1:-1)).map(([other])=>position.get(other)).filter(v=>v!==undefined));
          return {g,index,score:neighbors.length?neighbors.reduce((a,b)=>a+b,0)/neighbors.length:index};
        });
        scored.sort((a,b)=>a.score-b.score||a.index-b.index);
        rows.set(level,scored.map(v=>v.g));
      }
    }
    const nodes=[];let maxWidth=0;
    const GAP=29, ROW_H=182;
    for(let li=0;li<levels.length;li++){
      const row=rows.get(levels[li]);let x=0;
      for(const g of row){
        for(const id of g.members){nodes.push({id,x,y:li*ROW_H+50});x+=CARD_W+GAP;}
        x+=17;
      }
      maxWidth=Math.max(maxWidth,x);
    }
    for(const n of nodes)n.x+=(maxWidth-(rows.get(rank.get(n.id)).reduce((v,g)=>v+g.members.length*(CARD_W+GAP)+17,0)))/2+40;
    const pos=new Map(nodes.map(n=>[n.id,n]));
    return {nodes,pos,edges:[],all:true,w:maxWidth+100,h:levels.length*ROW_H+70};
  }
  const allGraph=buildAllGraph();
  function relationGroup(container,title,ids) {
    container.append(E('div','mini-label',title));
    if(!ids.length){container.append(E('div','empty','Нет сведений в файле'));return;}
    for(const id of ids){
      const p=people.get(id), b=E('button','rel');
      b.append(E('span','',label(p)),E('small','',life(p) + '  ↗'));
      b.onclick=()=>select(id); container.append(b);
    }
  }
  function showDetails() {
    const p=people.get(selected), box=$('details'); box.replaceChildren();
    box.append(E('div','eyebrow','В центре дерева'),E('h2','',label(p)));
    const facts=[];
    if(p.birth)facts.push(`Рождение: ${p.birth}${p.birthPlace ? ' · '+p.birthPlace : ''}`);
    if(p.death)facts.push(`Смерть: ${p.death}${p.deathPlace ? ' · '+p.deathPlace : ''}`);
    if(!facts.length)facts.push('Даты жизни не указаны в исходном файле');
    for(const f of facts)box.append(E('div','profile-sub',f));
    relationGroup(box,'Родители',parentIds(p));
    relationGroup(box,'Партнёры',partnerIds(p));
    const sib=parentIds(p).length ? sorted((families.get(p.parentFamily)?.children||[]).filter(id=>id!==p.id)) : [];
    relationGroup(box,'Братья и сёстры',sib);
    relationGroup(box,'Дети',sorted(childIds(p)));
  }
  function buildGraph() {
    const nodes=[], edges=[], ancestry=mode==='anc', counts=new Map();
    function walk(id,d,path) {
      const key=`${id}:${nodes.length}`;
      const n={id,key,d,x:0,y:0,children:[]}; nodes.push(n);
      if(d < depth && !path.has(id)) {
        const p=people.get(id), next=ancestry ? parentIds(p) : childIds(p);
        for(const child of next) {
          if(path.has(child))continue;
          const c=walk(child,d+1,new Set([...path,id]));
          n.children.push(c); edges.push([n,c]);
        }
      }
      return n;
    }
    const root=walk(selected,0,new Set());
    let nextX=0;
    function position(n) {
      for(const c of n.children)position(c);
      n.x = n.children.length ? (n.children[0].x+n.children[n.children.length-1].x)/2 : nextX++*DX;
      n.y = (ancestry ? depth-n.d : n.d)*DY;
    }
    position(root);
    const minX=Math.min(...nodes.map(n=>n.x));
    const minY=Math.min(...nodes.map(n=>n.y));
    for(const n of nodes){n.x=n.x-minX+50;n.y=n.y-minY+50;}
    width=Math.max(...nodes.map(n=>n.x))+CARD_W+50;
    height=Math.max(...nodes.map(n=>n.y))+CARD_H+50;
    return {nodes,edges};
  }
  function render(shouldFit=true) {
    $('all').classList.toggle('active',mode==='all');
    $('anc').classList.toggle('active',mode==='anc');
    $('desc').classList.toggle('active',mode==='desc');
    $('depthText').textContent=mode==='all'?'7 поколений · 243 человека':`До ${depth+1} поколений`;
    $('less').hidden=mode==='all';$('more').hidden=mode==='all';
    const graph=mode==='all'?allGraph:buildGraph();
    const {nodes,edges}=graph, svg=$('lines'), holder=$('nodes');
    if(graph.all){width=graph.w;height=graph.h;}
    svg.replaceChildren();holder.replaceChildren();
    svg.setAttribute('width',width);svg.setAttribute('height',height);
    $('stage').style.width=width+'px';$('stage').style.height=height+'px';
    function line(d){const path=document.createElementNS('http://www.w3.org/2000/svg','path');path.setAttribute('d',d);svg.append(path);}
    if(graph.all)for(const f of data.families){
      const a=graph.pos.get(f.father),b=graph.pos.get(f.mother);
      const parents=[a,b].filter(Boolean);
      if(!parents.length)continue;
      const cy=parents[0].y+CARD_H+22;
      const x1=parents[0].x+CARD_W/2, x2=parents.length>1?parents[1].x+CARD_W/2:x1;
      const mid=(x1+x2)/2;
      if(parents.length>1){
        if(f.children.length)line(`M ${x1} ${parents[0].y+CARD_H} V ${cy} H ${x2} V ${parents[1].y+CARD_H}`);
        else line(`M ${parents[0].x+CARD_W} ${parents[0].y+CARD_H/2} H ${parents[1].x} `);
      } else if(f.children.length)line(`M ${x1} ${parents[0].y+CARD_H} V ${cy}`);
      for(const id of f.children){
        const child=graph.pos.get(id);if(!child)continue;
        const cx=child.x+CARD_W/2, y=child.y;
        const bend=(cy+y)/2;
        line(`M ${mid} ${cy} C ${mid} ${bend}, ${cx} ${bend}, ${cx} ${y}`);
      }
    }
    else for(const [a,b] of edges){
      const x1=a.x+CARD_W/2, x2=b.x+CARD_W/2;
      const y1=mode==='anc' ? a.y : a.y+CARD_H;
      const y2=mode==='anc' ? b.y+CARD_H : b.y;
      const mid=(y1+y2)/2;
      const path=document.createElementNS('http://www.w3.org/2000/svg','path');
      path.setAttribute('d',`M ${x1} ${y1} C ${x1} ${mid}, ${x2} ${mid}, ${x2} ${y2}`);
      svg.append(path);
    }
    for(const n of nodes){
      const p=people.get(n.id), card=E('button','person'+(p.sex==='F'?' female':'')+(n.id===selected?' focus':''));
      card.style.left=n.x+'px';card.style.top=n.y+'px';
      card.title='Открыть ветвь: '+label(p);
      card.append(E('span','name',label(p)),E('span','years',life(p)||'Дата неизвестна'));
      card.onclick=()=>select(n.id);
      holder.append(card);
    }
    showDetails();
    if(shouldFit)requestAnimationFrame(fit);
  }
  function applyTransform() {$('stage').style.transform=`translate(${tx}px,${ty}px) scale(${scale})`;}
  function fit() {
    const v=$('viewport'), vw=v.clientWidth, vh=v.clientHeight;
    if(!vw||!vh)return;
    scale=Math.min(1.28,Math.max(.035,Math.min((vw-32)/width,(vh-38)/height)));
    tx=(vw-width*scale)/2;ty=(vh-height*scale)/2;applyTransform();
  }
  function zoom(factor,cx,cy) {
    const old=scale;scale=Math.min(4,Math.max(.035,scale*factor));
    tx=cx-(cx-tx)*scale/old;ty=cy-(cy-ty)*scale/old;applyTransform();
  }
  function select(id) {
    if(!people.has(id))return;
    selected=id;$('results').classList.remove('show');$('search').value='';
    $('modal').classList.remove('show');
    if(mode==='all'){
      render(false);
      const n=allGraph.pos.get(id),v=$('viewport');
      if(n){scale=Math.max(scale,.78);tx=v.clientWidth/2-(n.x+CARD_W/2)*scale;ty=v.clientHeight/2-(n.y+CARD_H/2)*scale;applyTransform();}
    }else render();
  }
  $('all').onclick=()=>{mode='all';render();};
  $('anc').onclick=()=>{mode='anc';render();};
  $('desc').onclick=()=>{mode='desc';render();};
  $('less').onclick=()=>{depth=Math.max(1,depth-1);render();};
  $('more').onclick=()=>{depth=Math.min(8,depth+1);render();};
  $('home').onclick=()=>{selected=rootId;mode='anc';depth=4;render();};
  $('fit').onclick=fit;
  $('zoomIn').onclick=()=>zoom(1.25,$('viewport').clientWidth/2,$('viewport').clientHeight/2);
  $('zoomOut').onclick=()=>zoom(.8,$('viewport').clientWidth/2,$('viewport').clientHeight/2);
  const viewport=$('viewport'), pointers=new Map();let drag=null,pinch=null;
  function point(e){const r=viewport.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top};}
  function startPinch(){
    const pair=[...pointers.entries()].slice(0,2),a=pair[0][1],b=pair[1][1];
    const x=(a.x+b.x)/2,y=(a.y+b.y)/2;
    pinch={ids:pair.map(([id])=>id),distance:Math.max(1,Math.hypot(a.x-b.x,a.y-b.y)),scale,worldX:(x-tx)/scale,worldY:(y-ty)/scale};
    drag=null;
    for(const [id] of pair)try{viewport.setPointerCapture(id);}catch{}
  }
  viewport.addEventListener('pointerdown',e=>{
    const onCard=!!e.target.closest('.person');
    if(onCard && e.pointerType==='mouse')return;
    const p=point(e);pointers.set(e.pointerId,p);
    if(pointers.size===1){
      drag=onCard?null:{x:p.x,y:p.y,tx,ty};
      if(!onCard)viewport.setPointerCapture(e.pointerId);
    }else if(pointers.size===2)startPinch();
    viewport.classList.add('dragging');
  });
  viewport.addEventListener('pointermove',e=>{
    if(!pointers.has(e.pointerId))return;
    const p=point(e);pointers.set(e.pointerId,p);
    if(pinch && pinch.ids.every(id=>pointers.has(id))){
      const [a,b]=pinch.ids.map(id=>pointers.get(id));
      const distance=Math.max(1,Math.hypot(a.x-b.x,a.y-b.y));
      scale=Math.min(4,Math.max(.035,pinch.scale*distance/pinch.distance));
      tx=(a.x+b.x)/2-pinch.worldX*scale;
      ty=(a.y+b.y)/2-pinch.worldY*scale;
      applyTransform();
    }else if(drag){tx=drag.tx+p.x-drag.x;ty=drag.ty+p.y-drag.y;applyTransform();}
  });
  function endPointer(e){
    pointers.delete(e.pointerId);pinch=null;
    if(pointers.size>=2)startPinch();
    else if(pointers.size===1){const p=pointers.values().next().value;drag={x:p.x,y:p.y,tx,ty};}
    else {drag=null;viewport.classList.remove('dragging');}
  }
  viewport.addEventListener('pointerup',endPointer);viewport.addEventListener('pointercancel',endPointer);
  viewport.addEventListener('wheel',e=>{e.preventDefault();const r=viewport.getBoundingClientRect();zoom(e.deltaY<0?1.12:.89,e.clientX-r.left,e.clientY-r.top);},{passive:false});
  window.addEventListener('resize',fit);

  function matches(q){return data.people.filter(p=>p.name.toLocaleLowerCase('ru').includes(q)).sort((a,b)=>a.name.localeCompare(b.name,'ru'));}
  $('search').addEventListener('input',e=>{
    const q=e.target.value.trim().toLocaleLowerCase('ru'), box=$('results');box.replaceChildren();
    if(!q){box.classList.remove('show');return;}
    for(const p of matches(q).slice(0,20)){
      const row=E('button','result',p.name);row.append(E('small','',life(p)||'Дата неизвестна'));row.onclick=()=>select(p.id);box.append(row);
    }
    if(!box.children.length)box.append(E('div','empty','Ничего не найдено'));
    box.classList.add('show');
  });
  $('search').addEventListener('keydown',e=>{if(e.key==='Escape')$('results').classList.remove('show');if(e.key==='Enter')$('results').querySelector('button')?.click();});
  document.addEventListener('click',e=>{if(!e.target.closest('.search-area'))$('results').classList.remove('show');});
  function populateAll(){
    const q=$('allSearch').value.trim().toLocaleLowerCase('ru'), list=$('allList');list.replaceChildren();
    const frag=document.createDocumentFragment();
    for(const p of matches(q)){
      const row=E('button');row.append(E('span','',p.name),E('small','',life(p)));
      row.onclick=()=>select(p.id);frag.append(row);
    }
    list.append(frag);
  }
  $('showAll').onclick=()=>{$('modal').classList.add('show');$('allSearch').value='';populateAll();$('allSearch').focus();};
  $('allSearch').oninput=populateAll;
  $('closeModal').onclick=()=>$('modal').classList.remove('show');
  $('modal').addEventListener('click',e=>{if(e.target===$('modal'))$('modal').classList.remove('show');});
  document.addEventListener('keydown',e=>{if(e.key==='Escape')$('modal').classList.remove('show');});
  render();
})();
</script>
