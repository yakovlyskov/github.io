{title:'Проверьте доступ до занятия',short:'Получить доступ',phase:'Подготовка',time:'5 минут',lead:'Это подготовительная работа. Если права уже есть, просто проверьте доступ и сохраните отметку — повторно подавать заявку не нужно.',body:()=>grid([['Где','Alfa People → универсальная заявка на доступ. Рабочая ссылка — в оригинале инструкции.'],['Система и действие','«АЛЬФА-МЕТРИКА» → «Для себя» / «Для коллеги» → «Предоставить».'],['Нужный доступ','«Доступ к системе Superset и пользовательскому интерфейсу Альфа-Метрика.UI»; согласие с правилами Superset; «09. Редактор АБ-платформы».'],['Вложение','В блоке «Скриншот результатов тестирования» по принятому в инструкции порядку приложить пустой Word или иной разрешённый файл. Форматы: .doc, .docx, .xls, .xlsx, .pdf, .jpg, .png, .jpeg.'],['Дополнительная информация','«Получение доступа к АБ-платформе». Формулировка «Служебная необходимость» не подходит. После проверки отправить заявку и дождаться предоставления прав.']])+sourceNote('раздел 1'),quiz:q('Доступ ещё не предоставлен. Что делаем?', ['Считаем отправленную заявку готовым доступом','Ждём выдачи прав; пока готовим гипотезу и материалы','Используем учётную запись коллеги'],1,['Отправка заявки и выдача прав — разные состояния.','Верно. Подготовку можно продолжать, реальную настройку — после выдачи прав.','Для упражнения нужен собственный согласованный доступ.']),fields:[f('access','Состояние доступа и следующий шаг','Права уже есть / заявка отправлена / требуется помощь. Не вводите клиентские идентификаторы.')],rubric:['Проверили свой доступ или зафиксировали конкретную зависимость.'],feedback:'Заявка не гарантирует доступ к тестовому экрану. Для него отдельно требуется включение сотрудника администратором в белый список и в команду конкретного эксперимента.'},
{title:'Сначала проект в Jira',short:'Оформить Jira',phase:'Подготовка',time:'15 минут',external:'jira',lead:'Платформа не заменяет проектное описание. В текущем гибридном процессе нужны и Jira, и карточка эксперимента.',body:()=>grid([['Board / Issue Type','GH Project / Project. Labels — команда, если известна.'],['Epic Link','Актуальный эпик текущего квартала уточнить у PM. Пример на скриншоте не является текущим значением.'],['Обязательные сведения','Цель, ключевая метрика, аудитория, потенциальный экономический эффект с основаниями, примерный срок внедрения, ФИО заказчика и КП, охват.'],['Description','Ожидаемые результаты и сроки, помощь от GH, зависимости и ограничения. Выбранный виджет, диплинк / лендинг, картинка для cardwithimage, Android, Главный экран, исследования.'],['Согласованность','Значения в Jira и карточке платформы должны соответствовать друг другу.']])+artifactPanel('Заготовка из ваших ответов',['jira'])+route()+sourceNote('раздел 2'),fields:[f('economics','Потенциальный эффект и основания','Формула, исходные допущения и что ещё неизвестно. Не выдавайте допущения за доказанные доходы.'),f('implementation','Ожидаемый срок внедрения, зависимости и помощь GH','При успешном тесте… Нужны…'),f('ownerCP','Заказчик и клиентский путь','Можно указать роль и название КП; персональные данные остаются в рабочей Jira.','','text'),f('jiraRef','Ссылка или код проекта в Jira','GH-…','','text')],feedback:'Если не знаете денежный эффект, обозначьте допущения и запрос к владельцу экономики. Предварительная оценка обязательна, но точность нельзя подменять выдуманными цифрами. Примерно через два месяца после эксперимента GH уточнит внедрение и фактический эффект.'},
{title:'Согласуйте измерение и ответственность',short:'Согласовать план',phase:'Подготовка',time:'10 минут',lead:'До настройки обсудите план с продуктовым аналитиком GH и владельцем продукта, в котором размещаете изменение.',body:()=>grid([['С аналитиком GH','Ключевая и дополнительные метрики, события и разметка, системы аналитики, источники, аудитория и деление, размер, длительность, завершение и оценка.'],['Роль заказчика','Назвать источники и таблицы, организовать необходимые доступы. Самостоятельный поиск таблиц и получение доступов без участия заказчика не входят в задачу аналитика.'],['Владелец продукта','Если размещение в чужом продукте или воспроизводится чужой сценарий — получить разрешение владельца до запуска.'],['Тексты и сценарий','Редакционная политика и деловая этика действуют и для сотрудников. Ссылка на политику добавлена в версию 2.3.'],['Нетипичные механики','Например, лотерея: согласование со специалистами по рискам. Елена Носова — пример контакта; при сомнениях Яков Лысков помогает определить необходимость. Где фиксировать согласование, ещё уточняется (Q6).']])+note('Контакт и порядок назначения аналитика остаются открытым вопросом Q3. Упоминание Дмитрия Горбунова не означает назначение. Таблица команд в приложении — повод уточнить действующего ответственного, а не автоматически назначить человека.')+sourceNote('разделы 3 и 14'),quiz:q('Для метрики нужна таблица, к которой у аналитика нет доступа. Чья это зависимость?', ['Аналитик сам найдёт таблицы и получит все права','Заказчик сообщает источник и организует доступы вместе с аналитиком','Достаточно указать «транзакции» в тэге'],1,['По инструкции требуется участие заказчика.','Да. Тэг не заменяет договорённость об измерении и доступных данных.','Категория метрики — не определение числителя, знаменателя и источника.']),fields:[f('agreements','Кто участвует и что ещё нужно согласовать?','Роли: аналитик, владелец сценария, подготовка страниц/ссылок, при необходимости риски. Укажите блокеры.')],rubric:['Зафиксировали ответственных и зависимости, не придумали неутверждённые контакты.'],feedback:'Для первого кейса ведущий может играть роль аналитика и выдавать готовый план. В реальном запуске договорённости должны быть подтверждены принятым процессом.'},
{title:'Три разных проверки — не перепутайте',short:'Разделить проверки',phase:'Подготовка',time:'5 минут',lead:'У онбординга, тестового экрана и клиентского эксперимента разные задачи и требования.',body:()=>grid([['Однократный онбординг','Один раз для каждого заказчика: полный запуск на заранее уведомлённых выбранных сотрудниках. Только их КУСы. БЗРБ необязательна.'],['Тестовый экран','Перед модерацией каждого эксперимента, в том числе учебного и всех будущих клиентских. Работает в боевом АМ, доступ у участников команды тестирования из белого списка.'],['Будущий клиентский запуск','Повторный полный онбординг не нужен. Проверка текущего эксперимента на тестовом экране и опубликованная БЗРБ с подключением CX обязательны.']])+note('Android и Главный экран — текущие ограничения для обоих видов запуска. Пункты iOS/Web в интерфейсе не доказывают доступность запуска. Самостоятельная загрузка новых картинок, сегментатор и конструктор лендингов — планы развития, а не доступные функции.')+sourceNote('введение и разделы 3, 6, 11'),quiz:q('Заказчик прошёл онбординг месяц назад. Можно пропустить тестовый экран для нового теста?', ['Да, он уже знаком с платформой','Нет: проверяем текущий эксперимент на тестовом экране перед модерацией','Нужно заново пройти полный запуск онбординга перед каждым тестом'],1,['Знакомство с процессом не проверяет новые настройки.','Верно. Повторять весь онбординг не требуется, проверка нового эксперимента обязательна.','Полный онбординг однократный, а тестовый экран обязателен для каждого эксперимента.']),feedback:'В этом уроке фактически запускаем только однократный тестовый эксперимент на сотрудниках. Клиентскую ветку дальше разберём как сценарий, без публикации предложения клиентам.'},
{title:'Заполните «Об эксперименте»',short:'Создать карточку',phase:'Настройка',time:'15 минут',lead:'Нажмите создание эксперимента справа вверху, заполните базовую информацию и «Продолжить заполнение». Затем пройдите три раздела: «Об эксперименте», «Аудитория», «Варианты теста».',body:()=>grid([['Базовые поля','Понятное название. Автора проверить: на показанном в инструкции экране он заблокирован для редактирования. Тип: «Новое решение» / «Существующее решение». Для изменения текста существующего сценария обсуждаем второй.'],['Цель эксперимента','«Выявляющий» / «Подтверждающий» — совместно с аналитиком. По подсказке: выявляющий — наличие влияния; подтверждающий — величина, устойчивость и измеримость. Не подменяет конкретную гипотезу.'],['Тэги','Экран — Главный экран; продукт; бизнес-метрика — «поведение» / «транзакции»; сегмент — N2B, Active, Sleep, Reactive, Winback или Longsleep по методологии банка.'],['Четыре поля описания','«Бизнес цель», «Предпосылки», «Что тестируем?», «Гипотеза». Каждое — максимум 500 символов. Категория метрики в тэгах не заменяет её определения.']])+sourceNote('разделы 4–5'),fields:[{...f('cardGoal','Бизнес цель','Почему эксперимент нужен сейчас?'),max:500},{...f('cardPremise','Предпосылки','Данные и наблюдения из кейса.'),max:500},{...f('cardTest','Что тестируем?','Что меняется и что увидит участник?'),max:500},{...f('cardHypothesis','Гипотеза для карточки','Если X, то Y, потому что…'),max:500}],rubric:['Все четыре поля помещаются в лимит 500 символов.','Смысл карточки совпадает с Jira и планом аналитика.'],feedback:'Заготовка этих четырёх полей появится в «Полях платформы». Названия категорий выбирайте по методологии и договорённости с аналитиком; урок не назначает сегмент по бытовому смыслу слова «активный».'},
{title:'Настройте расписание и проверяющих',short:'Расписание и роли',phase:'Настройка',time:'10 минут',lead:'Расписание задаётся интервалами, а доступ к тестовому экрану требует отдельной настройки команды.',body:()=>grid([['Начало и окончание','Выбрать дату запуска и двухчасовой интервал времени, затем дату и время окончания. Автозавершение предусмотрено. Интервал 10:00–12:00 — пример, не обещание точной минуты.'],['Для учебного запуска','Короткое согласованное окно на сотрудников; план «14 + 7» относится только к вымышленному бизнес-анализу.'],['Белый список','Администратор включает сотрудника после проверки КУСа и обсуждения целесообразности доступа с запускающим. Наличие редакторских прав само по себе не заменяет белый список.'],['Команда тестирования','Поиск «Введите ФИО или CUS», «Изменить проверяющих». В каждом эксперименте, учебном и клиентском, обязательны Кирилл К. и Яков Л.'],['Две разные сущности','Команда тестирования даёт проверяющим тестовый экран. Загруженная аудитория вариантов определяет, кому показывается эксперимент после запуска.']])+sourceNote('раздел 6'),quiz:q('Коллега имеет права редактора, но не видит тестовый экран. Что проверить?', ['Только добавить его в боевую аудиторию варианта','Белый список администратора и «Команду тестирования» конкретного эксперимента','Запустить эксперимент для всех сотрудников'],1,['Аудитория и права на тестовый экран решают разные задачи.','Верно. Для тестового экрана нужны белый список и команда конкретного эксперимента.','Расширение аудитории не исправляет доступ проверяющего.']),fields:[f('schedule','Какое учебное окно и кто проверяет?','Укажите согласованные дату/интервал начала и окончания, роли и готовность белого списка.')],rubric:['Не обещаете запуск в точную минуту и учли время модерации.','Проверили обязательных GH-проверяющих и доступ своей команды.'],feedback:'После согласования будет запуск по расписанию. Если из-за ожидания модерации окно стало неактуальным, дальнейшие действия и перенос нужно уточнить с GH: инструкция не задаёт универсальный порядок для пропущенного окна.'},
{title:'Аудитория: цифры и непересекающиеся файлы',short:'Проверить аудиторию',phase:'Настройка',time:'15 минут',lead:'SQL и сбор клиентов за вас делает подготовленный маршрут с аналитиком. Ваша задача — понять параметры и заметить ошибки.',body:()=>grid([['Калькулятор','Android; общий реальный охват; число вариантов, включая контрольный, подгружается из «Варианты теста».'],['Baseline и прирост','Из 15% в 18% → текущее 15, желаемый прирост 3 или 3%. Здесь это +3 процентных пункта, не относительные 20%. Если baseline неизвестен, согласовать заполнение с аналитиком; «1» на скриншоте не правило.'],['Файлы','Для каждого варианта отдельный подготовленный .txt. Точный разделитель, кодировка и наличие заголовка не подтверждены в инструкции (Q4). Получить готовые файлы и формат у аналитика / ведущего.'],['Пересечения','Один КУС — только один вариант; нельзя одновременно участвовать в другом действующем эксперименте. Правило действует и для сотрудников, заказчика, команды, модераторов.'],['Что видит приложение','Для этого размещения есть один скрытый по умолчанию виджет. Одному участнику нельзя одновременно выдать несколько вариантов или дополнительные виджеты. Для просмотра всех вариантов нужен тестовый экран.'],['История','Поиск может показать завершённые эксперименты. Проверяйте статус: историческое участие и участие в другом действующем тесте — разные ситуации.']])+sourceNote('разделы 7–9 и Q4'),quiz:q('Вы хотите проверить A и B и включили свой КУС в оба списка. Что исправить?', ['Это допустимо для сотрудников и модераторов','Оставить один вариант; остальные проверить на тестовом экране. Также убрать пересечение с другими действующими тестами','Сделать второй виджет на том же экране'],1,['Исключения для сотрудников и модераторов нет.','Да. Непересекающиеся списки обязательны, а тестовый экран позволяет проверить каждый вариант.','В этом размещении второй виджет для обхода ограничения не предусмотрен.']),fields:[f('audienceReceipt','Как проверите готовые файлы без ручного сбора аудитории?','Кто подготовил; фактическое число сотрудников; число в A/B; проверка пересечений и формата. Реальные КУСы здесь не указывайте.')],rubric:['Различили реальный учебный охват и вымышленные 20 000 клиентов.','Получили формат .txt от ответственного, не придумали его.','Проверили все группы и другие действующие эксперименты.'],feedback:'Платформа обнаруживает межэкспериментальное пересечение и не даст запустить тест. Проверка до модерации экономит цикл доработок. Распределение и размер групп определяются с аналитиком, не встроенным сегментатором.'},
{title:'Заполните варианты и проверьте переход',short:'Настроить виджеты',phase:'Настройка',time:'10 минут',lead:'Для основного кейса используйте «Виджет — кнопка». Ветку с иллюстрацией тоже разберём, чтобы не приписывать платформе лишние возможности.',body:()=>grid([['Загрузка аудитории','«Варианты теста» → «ID клиентов (customer_ID)» → «+» → .txt. Если появляется «Загрузить *.txt», нажать. После загрузки и сохранения сверить число CUS. Для следующего варианта — «Добавить вариант».'],['Кнопка','Заголовок до 200 символов и «Адрес диплинка». Отдельной картинки нет.'],['Карточка с иллюстрацией','«Виджет — карточка с иллюстрацией и текстом»: заголовок до 200 символов, ссылка на подготовленную картинку, диплинк. Новые картинки через саппортов; самостоятельная загрузка только планируется.'],['Диплинки','В подсказке приведены <code>https://online.alfabank.ru/webFeature?type=recommendation&amp;url={url}</code> и <code>alfabank://{screen}</code>. Фигурные скобки заменяются значениями для сценария. <code>alfabank://geo_map</code> — пример, не ссылка на накопления.'],['Предпросмотр','«Превью виджета» / «Весь экран»: текст, изображение и положение. Это не проверка реального перехода в приложении.'],['Состояния','«Не заполнен», «Частично заполнен», «Заполнен». Последнее не заменяет сохранение всей карточки.']])+artifactPanel('Подготовка для ручного переноса',['spec','audience','events','card'])+sourceNote('разделы 8–9'),fields:[f('deeplink','Проверенный диплинк для обоих вариантов','Предоставляет ведущий / владелец сценария; можно записать код согласования вместо внутреннего адреса.','','text')],rubric:['Заголовки не длиннее 200 символов; переход одинаков и согласован.','Файлы загружены, число CUS проверено, контроль учтён.','Не переносили буквальный шаблон с фигурными скобками в запускаемый вариант.'],feedback:'Наличие строки адреса не доказывает правильность перехода. Рабочий сценарий проверяется на тестовом экране и после реального запуска. Для первого кейса новый лендинг и картинка не обязательны.'},
{title:'«Заполнен» ещё не значит «Сохранён»',short:'Сохранить и проверить',phase:'Проверка',time:'10 минут',external:'draft',lead:'Теперь перенесите подготовленные ответы в рабочую платформу. Критерий — сохранённая карточка и успешная проверка черновика.',body:()=>artifactPanel('Поля и план',['card','passport','spec','audience','runbook'])+route()+grid([['Сначала','«Сохранить» справа вверху. Проверить смену «Не сохранён» → «Сохранён», аудиторию и варианты.'],['Затем','«Проверить черновик» слева. Исправить сообщения о незаполненных полях или ошибках, снова сохранить и повторить проверку.'],['Результат','После успешной проверки возможен статус «Готов к запуску». Это готовность настроек к следующему этапу, не подтверждение модератора и не фактический показ.']])+sourceNote('раздел 10'),fields:[f('draftRef','Ссылка или код карточки эксперимента','EXP-…','','text'),f('draftPain','Что затруднило подготовку и сохранение?','Действие → ожидаемый результат → фактический результат / обходной путь.')],feedback:'Выгрузки урока — вспомогательные документы. .txt загружается в поле аудитории. Остальные сведения переносите в реальные поля; возможность прикреплять любой Markdown / JSON инструкция не подтверждает.'},
{title:'Проверьте на тестовом экране',short:'Пройти тестовый экран',phase:'Проверка',time:'15 минут',external:'qa',lead:'Запускающий сотрудник или член его команды проверяет каждый вариант до отправки на модерацию. GH-проверяющие в списке не отменяют этой работы.',body:()=>route()+grid([['Где','Тестовый экран в боевом АМ по специальной ссылке из принятого процесса. Проверяющий — из белого списка и команды этого эксперимента.'],['Что','Внешний вид без искажений, текст, картинка при её наличии, нажатия, диплинк и весь пользовательский сценарий.'],['Аналитика','С помощью аналитика GH подтвердить, что необходимые метрики обеспечены событиями. Макет из урока не отправляет события автоматически.'],['После ошибок','Исправить до отправки, сохранить настройки и повторить необходимые проверки. Предпросмотр или статус «Готов» не заменяют эту проверку.']])+sourceNote('разделы 3, 6, 9, 11 и 13'),fields:[f('qaRef','Ссылка или код протокола проверки','Без КУСов и скриншотов с клиентскими данными.','','text'),f('qaPain','Где проверка потребовала ручной работы?','Как проверяли, где потребовалась помощь и почему?')],feedback:'Не пытайтесь показать все варианты одному сотруднику, добавив его в несколько списков. Используйте тестовый экран. Полный однократный выкат для онбординга — отдельный этап дальше.'},
{title:'Клиентский запуск: одной заявки в БЗРБ мало',short:'Разобрать БЗРБ и CX',phase:'Корнер-кейс',time:'5 минут',lead:'В нашем запуске только сотрудники, поэтому публикация БЗРБ необязательна. Но команда должна понимать обязательное условие будущего клиентского эксперимента.',body:()=>grid([['Для клиентов','Подготовить заявку по шаблону БЗРБ: статья нужна контактному центру для ответов клиентам. После создания заявки упомянуть в комментариях задачи CX-эксперта нужного направления из актуального справочника.'],['В карточке','«Ссылка на БЗРБ» — ссылка на опубликованную статью в Абуке, доступную сотрудникам компании. Ссылка только на заявку не подходит. Кнопка «Открыть» — проверить материал.'],['Перед клиентским запуском','Опубликованная доступная статья и упоминание нужного CX-эксперта — обязательные критерии. Без статьи клиентский эксперимент не запустится.'],['Исключение','Для однократного тестового онбординга на выбранных уведомлённых сотрудниках БЗРБ и связанное требование по CX не применяются.']])+sourceNote('раздел 11'),quiz:q('Готовится клиентский тест. Заявка на статью создана, но статья не опубликована. Можно отправить его как готовый к клиентскому запуску?', ['Да, номер заявки достаточно вставить в БЗРБ','Нет: нужна опубликованная доступная статья и упоминание актуального CX-эксперта','Да, если заказчик раньше прошёл онбординг'],1,['Заявка и опубликованная статья — разные артефакты.','Верно. Исключение касается онбординга на сотрудниках, не будущих клиентских тестов.','Прохождение онбординга не снимает требований к клиентскому эксперименту.']),feedback:'Это учебная ветка без задания опубликовать клиентскую статью. Ссылки на шаблон и справочник CX открывайте из оригинала инструкции; актуальность людей и доступность статьи проверяйте перед каждым запуском.'},
{title:'Кнопка «Запустить» отправляет на модерацию',short:'Пройти модерацию',phase:'Выкат',time:'10 минут + ожидание',external:'moderation',lead:'Нажатие кнопки не включает показ немедленно. Проверьте, что происходит с экспериментом после отправки.',body:()=>route()+grid([['Условия','Сохранённая карточка, пройденная проверка черновика, тестовый экран, команда проверяющих и правильная учебная аудитория. Для клиентской ветки ещё БЗРБ и CX.'],['Отправка','В статусе «Готов к запуску» нажать «Запустить эксперимент». Это отправка модератору.'],['Согласован','Модератор проверяет требования GH. При согласовании — «Ожидает выката», затем фактический запуск в выбранный двухчасовой интервал.'],['Возврат','«На доработку»: прочитать причину в комментарии, исправить, сохранить, повторить доступные действия проверки и отправки. Возврат не равен запуску.']])+sourceNote('разделы 10–11'),quiz:q('Статус «Ожидает выката». Коллега утверждает, что клиенты уже видят виджет. Что верно?', ['Модерация пройдена, но нужно дождаться фактического запуска по расписанию','Кнопка «Запустить» гарантирует немедленный показ','Нужно повторно нажать «Запустить» до появления виджета'],0,['Да. Статус и расписание нужно различать; затем проверить фактическую выдачу.','Инструкция прямо разделяет отправку на модерацию и запуск.','Повторные нажатия не заменяют проверку статуса и расписания.']),fields:[f('moderationRef','Ссылка или код отправки на модерацию','Карточка с историей статусов / код задачи.','','text'),f('moderationPain','Что произошло после отправки?','Текущий статус, комментарий при возврате, ожидание или выполненное действие.')],feedback:'Если замечания требуют изменения варианта, повторно проверяйте изменённые части на тестовом экране. Если окно выката прошло, согласуйте действия с GH, а не делайте предположение о поведении системы.'},
{title:'Проверьте фактический выкат',short:'Проверить запуск',phase:'Выкат',time:'10 минут',external:'launch',lead:'После модерации и наступления окна убедитесь в работе эксперимента в приложении, а не только в статусе карточки.',body:()=>route()+grid([['Учётная запись','Включённый в аудиторию уведомлённый сотрудник, который не состоит одновременно в другом действующем эксперименте.'],['Устройство и место','Android, боевая версия АМ, Главный экран. Не iOS, не другой экран, не отдельная тестовая среда.'],['Функциональность','Виджет виден, текст и картинка корректны, нажатие открывает нужный адрес, путь работает. Один сотрудник получает один вариант.'],['Измерение','После запуска с аналитиком GH проверить сбор аналитики по выбранным метрикам.']])+note('Если запуск ошибочный или сценарий не работает, обсудить исправление / остановку с GH. Урок не заменяет решение команды и не выполняет банковских операций.')+sourceNote('разделы 3, 11–12'),fields:[f('runRef','Ссылка или код проведённого запуска','Ссылка на эксперимент / историю выката.','','text'),f('launchPain','Что заметили после запуска?','Проверка выдачи, аналитики, статусов и времени ожидания.')],feedback:'Небольшой запуск на сотрудниках проверяет процесс. Он не доказывает рост пополнений. Дальше вы разберёте отдельный синтетический набор с полноценными окнами.'},
{title:'Один участник просит отключить его',short:'Отключить одного участника',phase:'Корнер-кейс',time:'10 минут',lead:'Учебная ситуация: сотрудник с условным КУСом 123456 просит прекратить участие. Остальным эксперимент мешать не должен.',body:()=>grid([['1. Найти эксперимент','На главной «Эксперименты» раскрыть режим поиска → «По CUS клиента» → ввести КУС. В истории бывают завершённые тесты; открыть нужный со статусом «Запущен».'],['2. Найти вариант','«Варианты теста» → раскрыть первый вариант → вручную ввести тот же КУС в «ID клиентов (customer_ID)». Главный поиск нашёл эксперимент, не конкретный вариант.'],['3. Если не найден','«Клиент не участвует в эксперименте» в первом варианте означает, что его нет в этом варианте. Раскрыть следующий и снова ввести КУС вручную; не отвергать результат общего поиска.'],['4. Отключить','В найденном варианте: зелёный индикатор, «Клиент участвует в эксперименте», «Отключить ID». Проверить идентификатор и нажать. Кнопка «Остановить» для этого не нужна.'],['5. Подтвердить','Дождаться «Клиент отключен от эксперимента», подтверждения под поиском и смены кнопки на «Включить ID». Остальные продолжают участие.'],['6. Вернуть при необходимости','Найти тот же КУС в том же варианте и «Включить ID». Не возвращать человека автоматически после его просьбы отключить; необходимость отдельно согласуется.']])+note('Это разбор сценария. Реальные КУСы в урок не вводим. Отрабатывать на рабочей платформе можно только на заранее согласованном тестовом участнике. Статистика жалоб, обязательные сроки и полный порядок эскалации в инструкции не подтверждены (Q7).')+sourceNote('раздел 11.1 и Q7'),quiz:q('Общий поиск нашёл запущенный тест, а в первом варианте «Клиент не участвует». Что дальше?', ['Остановить весь эксперимент','Проверить следующие варианты, каждый раз вручную вводя КУС','Значит, результат общего поиска ошибочен'],1,['Остановка всего теста не нужна для отключения одного участника.','Да. Участие в эксперименте и поиск конкретного варианта — разные шаги.','Первый вариант не обязательно тот, в который назначен пользователь.']),fields:[f('memberCase','Каким подтверждением закончится отключение одного участника?','Назовите уведомление / смену кнопки и отличие от остановки всего теста.')],rubric:['Отключаете ID в найденном варианте, не весь эксперимент.','Проверяете уведомление, подтверждение и смену на «Включить ID».'],feedback:'Правила одинаковы для сотрудников, заказчика и других клиентов. При необходимости остановки всего теста или эскалации жалобы решение обсуждается с GH; вымышленные SLA добавлять нельзя.'},
{title:'Завершите технический запуск',short:'Завершить запуск',phase:'Выкат',time:'5 минут',external:'stop',lead:'Техническое упражнение на сотрудниках не нужно держать активным ради статистики вымышленного кейса.',body:()=>route()+note('По инструкции эксперимент автоматически завершается по указанной дате и времени. Для досрочного прекращения — статус «Остановлен». Ошибки и дальнейшие действия обсудите с GH. Не путайте это с «Отключить ID», которое затрагивает одного участника.')+sourceNote('раздел 12'),fields:[f('stopRef','Ссылка или код подтверждения завершения','Карточка / история статусов.','','text'),f('stopObservation','Каким способом завершили и что проверили?','По расписанию / досрочно после обсуждения с GH; итоговое состояние.')],feedback:'Не утверждайте, что остановка автоматически возвращает конкретный старый интерфейс: инструкция этого поведения не описывает. Зафиксируйте фактически наблюдавшееся состояние и уточните ожидаемое с GH.'},
{...steps[10],phase:'Анализ',body:()=>msg('Ирина, руководитель продукта','<p>«Вернёмся к вымышленному бизнес-тесту. На третий день клики 12% против 8%. Давайте включим всем?»</p>')+note('Реальный технический запуск на сотрудниках завершён отдельно. Здесь данные вымышлены: качество назначений и событий проверено, но план набора и окна ещё не завершены.')},
{...steps[11],phase:'Анализ'},
{title:'Итоги заполняет аналитик GH',short:'Зафиксировать итоги',phase:'Анализ',time:'10 минут',external:'report',lead:'После завершения в карточке доступен раздел «Итоги эксперимента». Заказчик знакомится с анализом и согласует дальнейшие продуктовые действия.',body:()=>grid([['Ожидание результатов','Сообщение в карточке об ожидании аналитика не означает, что данные пропали. Ввод итогов — роль аналитика GH. Не обещаем заказчику права редактировать эти поля.'],['Поля аналитика','«Достигнут ли статистический эффект?» — Да / Нет; «Статистическая значимость» — величина эффекта и оценка (в подсказке alpha 0,05, beta 0,2).'],['Смысл результата','«Выводы», «Рекомендации», «Итоги в свободной форме» — смысл проверки, действия, дополнительные результаты и ограничения.'],['Материалы анализа','Слева «Ссылка на superset», если заполнена. Не предполагаем, что итоговый анализ автоматически рассчитан платформой.']])+artifactPanel('Передать аналитику / ведущему',['report'])+route()+sourceNote('раздел 12'),fields:[f('decision','Ваше решение','Внедрять ли вариант ради роста пополнений? Почему?'),f('next','Какой следующий шаг?','Что исследовать или проверить и какую неопределённость это снимет?'),f('reportRef','Ссылка или код записи с выводом','Карточка / протокол с аналитиком.','','text')],feedback:'В разборе «Да / Нет» не означает «точно есть / точно нет любой эффект». Объясните неопределённость и практический смысл. В рабочей карточке явно обозначьте, что синтетический результат — часть обучения, а не измерение запуска сотрудников.'},
{title:'Тест завершён. Что с внедрением?',short:'Проверить судьбу гипотезы',phase:'После эксперимента',time:'5 минут',lead:'Результат эксперимента и эффект внедрения — разные записи. Ваша платформа должна помогать сохранить связь между ними.',body:()=>msg('Команда GH','<p>«Примерно через два месяца после завершения уточним, внедрили ли проверенное решение. Если внедрили — расскажите о фактическом эффекте».</p>')+note('Это описанный в инструкции последующий контакт GH, а не автоматически созданное уроком напоминание. При отклонённой гипотезе тоже фиксируем дальнейшую судьбу и следующий шаг.')+sourceNote('раздел 2, потенциальный экономический эффект'),quiz:q('В Jira указали потенциальный эффект 10 млн. Можно записать его как фактический результат внедрения?', ['Да, если тест завершён','Нет: это предварительная оценка. Нужны факт внедрения и отдельное измерение эффекта','Да, если выросли клики'],1,['Завершение теста не подтверждает внедрение или доход.','Верно. Сохраняем основания предварительной оценки и отдельно проверяем, что реально внедрено и измерено.','Клики не подтверждают ни доход, ни внедрение.']),fields:[f('followup','Что нужно сохранить для последующего обсуждения?','Владелец решения, внедрили / нет, основания и способ проверки фактического эффекта.')],rubric:['Разделили результат теста, решение о внедрении и фактический эффект.'],feedback:'В нашем кейсе рост главной метрики не подтверждён, поэтому оснований внедрять ради роста пополнений пока нет. Предварительный экономический расчёт нельзя засчитать как заработанные деньги.'},
{...steps[13],phase:'Ретроспектива',external:'feedback',body:()=>note('Временный канал — пространство «Предложения» в Confluence, до появления отдельной формы. Опишите название эксперимента, действия, ожидаемый и фактический результат; при необходимости приложите скриншот в рабочей системе. Ссылка — в оригинале. После появления формы канал нужно обновить.')+`<details><summary>Показать ваши записи по ходу работы</summary>${painSummary()}</details>`+artifactPanel('Обратная связь',['retro'])+sourceNote('раздел 13 и Q1'),fields:[...steps[13].fields,f('feedbackRef','Ссылка или код переданной обратной связи','Пространство «Предложения» / согласованный актуальный канал.','','text')],feedback:'Для помощи в инструкции указаны Мухаммад Жалолов, Яков Лысков и Кирилл Контарук; рабочие контакты берите из актуального документа. При ошибках сверяйтесь с сообщениями платформы и GH. Приоритет — одно улучшение, связанное с наблюдаемой проблемой.'},
{title:'Где инструкция пока не даёт ответа',short:'Не выдумать правила',phase:'Корнер-кейсы',time:'5 минут',lead:'Уверенная работа включает умение остановиться на неподтверждённой детали и адресовать конкретный вопрос.',body:()=>grid([['Q1 · временно решено','Обратная связь — «Предложения» в Confluence. Отдельной формы пока нет; при появлении заменить адрес.'],['Q3 · открыто','Контакт / порядок назначения аналитика нужно подтвердить. Таблица команд и упоминания не доказывают назначение конкретного человека.'],['Q4 · открыто','Есть .txt, но точный разделитель, кодировка, заголовок, согласованный пример аудитории и способ фиксации пройденного онбординга не утверждены. Получить готовые файлы и договориться, кто подтвердит прохождение.'],['Q6 · частично закрыто','Редакционная политика уже дана в версии 2.3. Где фиксировать согласование рисков — ещё уточнить. Не считать всю тему согласований неурегулированной.'],['Q7 · открыто частично','Отключение одного участника описано. Статистика жалоб с периодом/базой, порядок эскалации, ответственный за остановку всего теста и обязательные сроки ещё не подтверждены.'],['Дополнительная зависимость кейса','Корректный рабочий диплинк, доступы, готовые файлы и окно модерации даёт реальный процесс. Длительность ожидания инструкция не гарантирует.']])+artifactPanel('Нерешённые вопросы и карта проверок',['risks','runbook'])+sourceNote('раздел 14'),quiz:q('Неизвестен разделитель внутри .txt. Как поступить?', ['Выбрать запятую: наверняка CSV','Получить подтверждённый формат / готовый файл у аналитика или ведущего; отметить вопрос Q4','Скопировать «1» со скриншота в поле метрики'],1,['В инструкции подтверждено расширение, а не CSV-разделитель.','Да. Сохраняем границу знания и устраняем конкретную зависимость.','Пример на скриншоте не решает формат файла и не является рекомендацией метрики.']),fields:[f('openQuestions','Какие вопросы остались у вашей команды и кому адресовать?','Для каждого: что неизвестно, почему это блокер и кто должен подтвердить. Если вопросов нет — укажите, кто подтвердил формат и завершение онбординга.')],rubric:['Не заменили неизвестный формат файла, назначение или SLA предположением.','Договорились, кто и где подтвердит прохождение однократного онбординга.'],feedback:'Эти вопросы остаются открытыми в источнике версии 2.3. Урок не превращает их в обязательные правила и не пытается заполнить пробелы по аналогии.'},
{...steps[14],body:()=>finishBody()}
];
courseSteps[8].quiz=q('В Jira чаще всего путают тип задачи. Какой Issue Type указан в инструкции?', ['Epic','Task','Project'],2,['Epic Link — связь с квартальным эпиком, а не тип создаваемой инициативы.','Для этого процесса в инструкции указан Issue Type Project.','Верно: Board GH Project, Issue Type Project; Epic Link отдельно уточняется у PM.']);
const audienceBody=courseSteps[13].body;
courseSteps[13].body=()=>audienceBody()+note('Из комментариев рецензента: успешная загрузка .txt сама по себе не доказывает, что участники соответствуют бизнес-критериям. Состав и фильтры проверяет аналитик; проверка пересечений не заменяет проверку сегмента. Baseline другой воронки не является автоматически пригодным baseline данного размещения. Если аудитории мало, пересмотрите дизайн с аналитиком; не добавляйте неподходящих людей ради размера выборки.');
const knownBody=courseSteps[27].body;
courseSteps[27].body=()=>knownBody()+`<details><summary>Важные замечания рецензента — пока не утверждённые правила</summary><ul class="list"><li>Обсуждаются маска названия файлов и формат client_pin в столбик без заголовка и знаков препинания. В утверждённом тексте Q4 это ещё открыто, поэтому урок не генерирует такой файл и не объявляет маску обязательной. Также отдельно уточняется состав участников команды в аудитории.</li><li>«КУС», CUS и подпись поля customer_ID встречаются в текущем интерфейсе; переименование в client_pin обсуждается. Не подставляйте произвольный ID другого типа: соответствие идентификаторов подтверждает аналитик.</li><li>Предложено переделать результаты: статистические различия, отдельные параметры анализа alpha/beta и поправки на множественные сравнения, таблица метрик по вариантам, файлы, уточнение роли рекомендаций. Это предложение развития, а не подтверждённые текущие поля или доступная загрузка вложений.</li><li>Идеи заменить калькулятор или назначать фиксированные 10к/50к по типу сценария — обсуждение, не готовый алгоритм расчёта. Ожидаемый абсолютный прирост не равен относительному росту.</li><li>Для нестандартной аудитории в обсуждении допускаются дополнительные выгрузки / таблицы / SQL от заказчика. В учебном кейсе ведущий и аналитик готовят их заранее; участники описывают критерии. При нехватке данных или доступов нужно учитывать задержку подготовки.</li></ul><p>Текущие действия берём из инструкции 2.3. Спорные предложения превращаем в вопросы и идеи для ретроспективы, а не в выдуманные обязательства.</p></details>`;
steps.splice(0,steps.length,...courseSteps);
const END=steps.length-1;

let state={version:2,current:0,data:{mode:'platform'},done:[],reviewed:[],self:{},attempts:{},external:{},updated:''};let storageOK=true;
function val(id){return state.data[id]||'';}
function safeURL(v){try{const u=new URL(v);return ['https:','http:'].includes(u.protocol)?u.href:'';}catch{return '';}}
function save(){state.updated=new Date().toISOString();try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true;}catch{storageOK=false;}document.getElementById('saveState').textContent=storageOK?'Сохранено в этом браузере':'Не удалось сохранить — скачайте JSON';}
function mock(h,c,b){return `<div class="mock-screen"><div class="mock-header">Главный экран · учебная иллюстрация</div><div class="bank-card" style="min-height:100px;display:flex;align-items:center"><span class="bank-button">${esc(h)}</span></div></div>`;}
function resultTable(){return `<div class="table-wrap"><table><thead><tr><th>Показатель</th><th>A · контроль</th><th>B · тест</th></tr></thead><tbody><tr><td>Назначены в группу</td><td>10 000</td><td>10 000</td></tr><tr><td>Нажали на карточку</td><td><strong>800 · 8%</strong><div class="metricbar"><span style="width:53%"></span></div></td><td><strong>1 200 · 12%</strong><div class="metricbar"><span style="width:80%"></span></div></td></tr><tr><td>Пополнили ≥ 1 000 ₽ за 7 дней</td><td><strong>500 · 5%</strong></td><td><strong>510 · 5,1%</strong></td></tr><tr><td>Пользователи с тех. ошибкой</td><td>20 · 0,2%</td><td>22 · 0,22%</td></tr></tbody></table></div>`;}
function route(){const u=safeURL(val('platform'));return `<div class="route">↗ &nbsp; ${u?`<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">Открыть вашу платформу в новой вкладке</a>`:'Откройте вашу платформу. Её адрес можно добавить в настройках.'}</div>${val('mode')==='review'?'<p class="mode-note">Режим обзора: внешнее выполнение не требуется и не будет засчитано автоматически.</p>':''}`;}
const artifactNames={jira:'Проект Jira · MD',card:'Поля платформы · MD',runbook:'Маршрут запуска · MD',risks:'Корнер-кейсы · MD',passport:'Паспорт · MD',spec:'ТЗ на виджеты · MD',audience:'Аудитория · MD',events:'События · JSON',variantA:'Макет A · HTML',variantB:'Макет B · HTML',report:'Итоговый отчёт · MD',retro:'Ретроспектива · MD',all:'Весь кейс · MD',progress:'Прогресс · JSON'};
function artifactPanel(title,keys){return `<div class="artifact-panel"><h3>${esc(title)}</h3><p style="font-size:13px;margin:0">Файлы собираются из ваших текущих ответов. Их можно прикрепить в платформе или скопировать текст в нужные поля.</p><div class="downloads">${keys.map(k=>`<button class="download" data-download="${k}">${artifactNames[k]}</button>`).join('')}</div></div>`;}
function painSummary(){return ['draftPain','qaPain','moderationPain','launchPain','stopObservation'].map((k,i)=>`<p><strong>${['Настройка и сохранение','Тестовый экран','Модерация','Выкат','Завершение'][i]}:</strong><br>${esc(val(k)||'Пока нет записи.').replace(/\n/g,'<br>')}</p>`).join('');}
function externalComplete(key){return (extChecks[key]||[]).every((_,i)=>state.external[key+'_'+i]===true)&&!!val(refFields[key]).trim();}
function finishBody(){const complete=Object.keys(extChecks).filter(externalComplete).length,passed=state.done.filter(n=>n<END).length;return `<div class="hero"><div class="finish" style="color:var(--lime)">↗</div><h2>${esc(val('team')||'Ваша команда')}, заберите кейс</h2><p>Гипотеза, Jira, поля платформы, план запуска, решение и ретроспектива собраны в документы.</p></div><div class="cards stats"><div class="card"><span class="big">${passed} / ${END}</span><span class="small">этапов пройдено</span></div><div class="card"><span class="big">${complete} / ${Object.keys(extChecks).length}</span><span class="small">внешних заданий подтверждено</span></div><div class="card"><span class="big">${val('mode')==='review'?'Обзор':'Практика'}</span><span class="small">выбранный режим</span></div></div>${passed<END?note('Открыт итог в режиме свободного просмотра. Непройденные этапы и неподтверждённые действия не считаются завершёнными.',true):''}${complete<Object.keys(extChecks).length?note('Не все действия в платформе подтверждены. Это не завершённый практический онбординг. Вернитесь к внешним заданиям, когда будут готовы доступы, материалы и окно выката.',true):note('Все внешние задания отмечены участником. По Q4 ещё требуется договорённость с GH, кто и где подтверждает однократный онбординг. Галочки урока не заменяют такое подтверждение.')}<div class="section"><h2>Что подготовили</h2>${['Проверяемую гипотезу и определение метрики','Материалы для Jira и полей платформы с лимитами','Контрольный список настройки, тестового экрана, модерации и выката','Разбор отключения участника, остановки и клиентской БЗРБ','Решение по синтетическим данным и дальнейшую судьбу гипотезы','Наблюдения о платформе и нерешённые вопросы'].map(t=>`<div class="status-row"><span>·</span><span>${t}</span></div>`).join('')}</div>${artifactPanel('Забрать результаты',['all','jira','card','runbook','report','retro','risks','progress'])}<p style="font-size:13px;color:var(--muted)">Ответы хранятся в этом браузере. JSON переносит прогресс, Markdown удобен для обсуждения. Реальные КУСы и клиентские логи в урок не вводите.</p>${sourceNote('все разделы 1–14')}<details><summary>О методике и данных</summary><p>Оригинальный кейс использует принцип «сначала решение, затем разбор». Свободные ответы оцениваете сами, закрытые вопросы проверяются по заданному ответу. Учебная аналитика не получена из фактического запуска.</p><a href="https://gopractice.ru/news/simulator-story/" target="_blank" rel="noopener noreferrer">GoPractice: история симулятора</a></details>`;}
function unlocked(){if(val('mode')==='review'&&val('tour')==='yes')return END;let n=0;while(state.done.includes(n)&&n<END)n++;return n;}
function renderNav(){const done=state.done.filter(n=>n<END).length;document.getElementById('sidebar').innerHTML=`<div class="eyebrow">Практический урок 02</div><div class="course-name">Первый<br>эксперимент</div><div class="progress-row"><span>${done} из ${END} этапов</span><span>${Math.round(done/END*100)}%</span></div><div class="progress-track" role="progressbar" aria-label="Прогресс урока" aria-valuemin="0" aria-valuemax="${END}" aria-valuenow="${done}"><div style="width:${done/END*100}%"></div></div><nav class="nav-list">${steps.map((s,i)=>`<button class="step-link ${i===state.current?'active':''} ${state.done.includes(i)?'done':''}" data-step="${i}" ${i>unlocked()?'disabled':''} ${i===state.current?'aria-current="step"':''}><span class="step-dot" aria-hidden="true">${state.done.includes(i)?'✓':String(i+1).padStart(2,'0')}</span><span>${s.short}</span></button>`).join('')}</nav><div class="side-note">${val('mode')==='review'?'Обзор'+(val('tour')==='yes'?' · свободная навигация':''):'Практика в вашей платформе'}${safeURL(val('platform'))?`<a class="platform-link" href="${esc(safeURL(val('platform')))}" target="_blank" rel="noopener noreferrer">Открыть платформу ↗</a>`:''}<p>Актуализировано по инструкции 2.3 от 23.10.2026. Бизнес-кейс и данные вымышлены.</p></div>`;}
function fieldHTML(x){const required=!(x.id==='backlogRef'||(steps[state.current].external&&/Ref$/.test(x.id)&&val('mode')==='review'));const limit=x.max||(x.type==='textarea'?12000:2000);return `<div class="field"><label for="f_${x.id}">${esc(x.label)}${required?' <span aria-hidden="true" style="color:#849178">*</span>':''}</label>${x.type==='textarea'?`<textarea id="f_${x.id}" data-field="${x.id}" placeholder="${esc(x.placeholder)}" maxlength="${limit}" ${required?'aria-required="true"':''}>${esc(val(x.id))}</textarea>`:`<input id="f_${x.id}" data-field="${x.id}" type="${esc(x.type)}" value="${esc(val(x.id))}" placeholder="${esc(x.placeholder)}" maxlength="${limit}" ${required?'aria-required="true"':''}>`}${x.max?`<span class="hint" id="count_${x.id}" role="status">${val(x.id).length} / ${limit} символов</span>`:''}${x.hint?`<span class="hint">${esc(x.hint)}</span>`:''}</div>`;}
function setupHTML(){return `<div class="field"><label for="mode">Как будете проходить?</label><select id="mode" data-field="mode"><option value="platform" ${val('mode')==='platform'?'selected':''}>С платформой — выполняем внешние задания</option><option value="review" ${val('mode')==='review'?'selected':''}>Обзор — изучаем без реального запуска</option></select><span class="hint">В обзоре внешние задания остаются неподтверждёнными. Режим можно изменить в настройках.</span></div><div class="field"><label for="platform">Адрес вашей платформы · необязательно</label><input id="platform" data-field="platform" type="url" placeholder="https://…" value="${esc(val('platform'))}"><span class="hint">Ссылка только открывает новую вкладку. Урок не подключается к системе.</span></div>`;}
function render(){renderNav();const n=state.current,s=steps[n],reviewed=state.reviewed.includes(n);document.getElementById('lesson').innerHTML=`<div class="chapter-meta"><span>${String(n+1).padStart(2,'0')} / ${steps.length} &nbsp; · &nbsp; ${esc(s.phase)}</span><span class="pill ${s.external?'external':''}">${s.external?'↗ Внешнее задание':esc(s.time)}</span></div>${val('migration')==='yes'?note('Урок обновлён по инструкции 2.3. Ответы старой версии сохранены; из-за изменения маршрута этапы и подтверждения нужно пройти заново. Старые ответы доступны в JSON.'):''}<h1 tabindex="-1" id="chapterTitle">${s.title}</h1><p class="lead">${s.lead}</p>${s.body?s.body():''}${s.special==='finish'?'':`<section class="task" aria-label="Ваше задание"><div class="task-tag">✎ &nbsp; Ваш ход</div>${s.quiz?`<fieldset style="border:0;padding:0;margin:0"><legend style="font-weight:750">${esc(s.quiz.q)}</legend><div class="options">${s.quiz.options.map((o,i)=>`<label class="option"><input type="radio" name="quiz" value="${i}" ${val('q'+n)===String(i)?'checked':''}><span>${esc(o)}</span></label>`).join('')}</div></fieldset>`:''}${s.fields?s.fields.map(fieldHTML).join(''):''}${s.special==='setup'?setupHTML():''}${s.external?`<div class="section"><h3>Подтверждение выполнения</h3><p style="font-size:12px;color:var(--muted)">Отмечайте только то, что сделали в рабочей системе. ${val('mode')==='review'?'В режиме обзора можно продолжить без этих отметок.':'Для продолжения нужны все отметки и ссылка / код выше.'}</p><div class="checks">${extChecks[s.external].map((t,i)=>`<label class="check"><input type="checkbox" data-external="${s.external+'_'+i}" ${state.external[s.external+'_'+i]?'checked':''}><span>${esc(t)}</span></label>`).join('')}</div></div>`:''}<div id="feedbackArea">${reviewed?feedbackHTML(n):''}</div><div id="error" role="alert" class="error"></div><div class="action-row"><div><button class="secondary" data-back ${n===0?'disabled':''}>← Назад</button></div><div style="text-align:right"><button class="primary" id="nextBtn">${reviewed?'Сохранить и продолжить →':s.external?'Проверить готовность →':'Ответить →'}</button></div></div><div class="action-hint" style="margin-top:12px">${s.rubric?'Свободный ответ: после отправки сверите его с критериями.':'Подтверждения внешних действий проверяете вы сами.'}</div></section>`}<footer>Growth Lab · оригинальный учебный кейс · ответы остаются в вашем браузере</footer>`;bindLesson();document.getElementById('saveState').textContent=storageOK?'Сохранено в этом браузере':'Не удалось сохранить — скачайте JSON';}
function feedbackHTML(n){const s=steps[n];return `<div class="feedback"><div class="label">${s.quiz?'Разбор решения':'Ориентир для самопроверки'}</div>${s.quiz?`<p>${esc(s.quiz.explain[s.quiz.correct])}</p>`:''}<p>${esc(s.feedback||'')}</p>${s.rubric?`<div class="self-title">Сверьте свой ответ</div><p style="font-size:12px;color:var(--muted)">Текст не проверяется автоматически. Если чего-то не хватает, дополните ответ и отметьте выполненные критерии.</p><div class="checks">${s.rubric.map((r,i)=>`<label class="check"><input type="checkbox" data-self="${n+'_'+i}" ${state.self[n+'_'+i]?'checked':''}><span>${esc(r)}</span></label>`).join('')}</div>`:''}</div>`;}
function showError(text){const e=document.getElementById('error');e.textContent=text;e.scrollIntoView({block:'nearest',behavior:'smooth'});}
function bindLesson(){document.querySelectorAll('[data-field]').forEach(e=>e.addEventListener('input',()=>{state.data[e.dataset.field]=e.value;if(e.dataset.field==='mode')invalidateExternal();save();if(['headline','copy','cta'].includes(e.dataset.field)){const p=document.getElementById('livePreview');if(p)p.innerHTML=mock(val('headline')||'Ваш заголовок','','Тот же заголовок кнопки');}const counter=document.getElementById('count_'+e.dataset.field);const currentField=(steps[state.current].fields||[]).find(f=>f.id===e.dataset.field);if(counter&&currentField?.max)counter.textContent=e.value.length+' / '+currentField.max+' символов';if(e.dataset.field==='mode')render();}));document.querySelectorAll('input[name=quiz]').forEach(e=>e.addEventListener('change',()=>{state.data['q'+state.current]=e.value;save();}));bindChecks();document.querySelectorAll('[data-download]').forEach(b=>b.addEventListener('click',()=>download(b.dataset.download)));document.querySelector('[data-back]')?.addEventListener('click',()=>go(state.current-1));document.getElementById('nextBtn')?.addEventListener('click',advance);}
function bindChecks(){document.querySelectorAll('[data-self]').forEach(e=>e.addEventListener('change',()=>{state.self[e.dataset.self]=e.checked;save();}));document.querySelectorAll('[data-external]').forEach(e=>e.addEventListener('change',()=>{state.external[e.dataset.external]=e.checked;save();}));}
function advance(){const n=state.current,s=steps[n];if(s.special==='finish')return;for(const x of s.fields||[]){if(x.id==='backlogRef'||(s.external&&/Ref$/.test(x.id)&&val('mode')==='review'))continue;const v=val(x.id).trim();const min=x.type==='textarea'?12:2;if(x.max&&v.length>x.max){showError(`Поле «${x.label}» должно содержать не больше ${x.max} символов.`);return;}if(v.length<min){showError(`Заполните поле «${x.label}»${x.type==='textarea'?' хотя бы одним содержательным предложением':''}.`);document.getElementById('f_'+x.id)?.focus();return;}}if(n===0&&val('platform')&&!safeURL(val('platform'))){showError('Укажите полный адрес платформы с https:// или оставьте поле пустым.');return;}if(s.external&&val('mode')==='platform'&&!externalComplete(s.external)){showError('Подтвердите все выполненные действия и укажите ссылку или код. Если пока нет доступа, сохраните прогресс и вернитесь позже либо выберите режим обзора.');return;}if(s.quiz){const answer=val('q'+n);if(answer===''){showError('Сначала выберите вариант ответа.');return;}state.attempts[n]=(state.attempts[n]||0)+1;save();if(Number(answer)!==s.quiz.correct){document.getElementById('feedbackArea').innerHTML=`<div class="feedback bad" role="status"><div class="label">Попробуйте ещё раз</div><p>${esc(s.quiz.explain[Number(answer)])}</p></div>`;document.getElementById('error').textContent='';document.getElementById('feedbackArea').scrollIntoView({block:'nearest',behavior:'smooth'});return;}}if(!state.reviewed.includes(n)){state.reviewed.push(n);save();render();document.getElementById('feedbackArea').scrollIntoView({block:'nearest',behavior:'smooth'});return;}if(s.rubric&&!s.rubric.every((_,i)=>state.self[n+'_'+i])){showError('Сверьте ответ с критериями и отметьте каждый пункт. При необходимости сначала дополните ответ.');return;}if(!state.done.includes(n))state.done.push(n);go(n+1);}
function go(n){if(n<0||n>=steps.length||n>unlocked())return;state.current=n;save();render();document.getElementById('sidebar').classList.remove('open');document.getElementById('menuBtn').setAttribute('aria-expanded','false');window.scrollTo({top:0,behavior:'instant'});document.getElementById('chapterTitle').focus({preventScroll:true});}
function invalidateExternal(){if(val('mode')==='platform'){state.data.tour='no';const first=steps.findIndex(s=>s.external&&!externalComplete(s.external));if(first>=0){state.done=state.done.filter(n=>n<first);state.current=Math.min(state.current,first);}}}
function stamp(){return new Date().toLocaleString('ru-RU',{timeZone:'Europe/Moscow'})+' МСК';}
function a(id){return val(id).trim()||'[не заполнено]';}
function externalMD(){return Object.keys(extChecks).map(k=>`- ${refLabels[k]}: ${externalComplete(k)?'подтверждено участником':'НЕ ПОДТВЕРЖДЕНО'}; ${a(refFields[k])}`).join('\n');}
function passport(){return `# Паспорт эксперимента — УЧЕБНЫЙ КЕЙС\n\nКоманда: ${a('team')}\nДата: ${stamp()}\nИсточник процесса: ${SOURCE_VERSION}\n${SOURCE}\n\n## Проблема\n${a('problem')}\n\n## Гипотеза\nБарьер: ${a('barrier')}\nИзменение: ${a('change')}\nМеханизм: ${a('mechanism')}\n\n## Бизнес-метрика и измерение\n${a('metric')}\nЗащитные проверки: ${a('guardrail')}\n\n## Раздельные планы\nВымышленный бизнес-тест: baseline 5%; MDE +1 п. п.; alpha 0,05, beta 0,2; минимум 10 000 на вариант, 14 дней набора + 7 дней завершения окон. Предположение бизнес-кейса о назначении при первом визите согласуется отдельно с аналитиком для реального теста.\nФактический технический онбординг: только согласованные уведомлённые сотрудники; готовые отдельные непересекающиеся .txt от аналитика; реальный малый охват и короткое расписание. Только Главный экран, Android, боевая версия АМ. Отдельной тестовой среды не создаётся. Сегментатор и автоматическая рандомизация платформой не предполагаются. Денежные операции не требуются.\n\n## Досрочная остановка\n${a('stop')}\n\n## Согласования и зависимости\n${a('agreements')}\n\n## Учебное расписание и проверяющие\n${a('schedule')}\n\n## Подтверждения участника\n${externalMD()}\n\nПрохождение однократного онбординга требует принятого с GH подтверждения; способ в источнике ещё уточняется Q4.\n`;}
function spec(){return `# ТЗ на варианты — виджет-кнопка\n\nИнструмент: «Виджет — кнопка». Android, Главный экран боевого АМ.\nA / контроль: «Пополнить накопительный счёт».\nB / тест: «${a('headline')}».\nЛимит заголовка 200 символов. Отдельного описания, CTA и изображения у этого формата источник не подтверждает.\nПереход одинаков в A/B: ${a('transition')}\nПроверенный адрес / код согласования: ${a('deeplink')}\n\nАдрес предоставляет / подтверждает ведущий или владелец сценария. alfabank://geo_map — пример другого сценария, не ссылка на накопления. Не подставлять буквальные фигурные скобки из шаблона.\n\n## Если выбран формат с иллюстрацией\nИнструмент «Виджет — карточка с иллюстрацией и текстом»: заголовок <=200, ссылка на подготовленное изображение, диплинк. Новые изображения через саппортов. Конструктор лендингов и самостоятельная загрузка картинок пока запланированы.\n\n## Проверка\n«Превью виджета» / «Весь экран» не заменяют тестовый экран в боевом АМ и проверку после выката. Проверить нажатия, переходы и полный сценарий. Состояние блока «Заполнен» не заменяет «Сохранить».\n\n## События\nСогласовать с аналитиком GH и обеспечить источники / доступы. events.json — предлагаемый учебный контракт, не встроенные события платформы. HTML-заготовки только иллюстрируют текст; ничего не публикуют и не отправляют в аналитику.\n`;}
function audience(){return `# Аудитория — требования к подготовке\n\n## Бизнес-сегмент кейса\nВключение: ${a('include')}\nИсключение: ${a('exclude')}\n\n## Фактическая аудитория онбординга\nТолько заранее уведомлённые согласованные сотрудники, без клиентских КУСов. Отдельные .txt для A и B готовит аналитик. Один КУС — один вариант; нельзя пересекаться с другими действующими экспериментами. Это касается сотрудников, заказчика, команды и модераторов. Историю завершённых тестов отличать от текущего участия.\nПлатформа принимает готовые списки, а не собирает сегмент автоматически. После «+» и выбора файла нажать «Загрузить *.txt», если такая кнопка появилась; после загрузки и сохранения проверить число CUS.\n\n## Чего не знаем из инструкции\nПодтверждено расширение .txt. Разделитель, кодировка, заголовок и согласованный пример остаются Q4. Урок не генерирует неподтверждённый формат файла. Получить готовые файлы / формат у аналитика или ведущего.\n\n## Проверка команды\n${a('audienceReceipt')}\n\nРеальные CUS в этом документе не приводятся.\n`;}
function events(){return {artifact:'Учебная схема; адаптировать под контракт вашей платформы',version:1,common:{experiment_id:'string',user_id:'pseudonymous string; не передавать в урок',variant:'A | B',timestamp:'ISO-8601'},events:[{name:'experiment_assignment',when:'первое подходящее посещение до показа',dedup:'одна запись на experiment_id + user_id'},{name:'card_view',when:'карточка показана',dedup:'по правилам показа'},{name:'card_click',when:'нажатие кнопки',analysis:'для конверсии считать уникальных пользователей'},{name:'qualified_topup',when:'успешное пополнение на сумму >= 1000 RUB',extra:{amount:'number',currency:'RUB',transaction_id:'string'},analysis:'пользователь максимум один раз в числителе, окно 7 дней от assignment'},{name:'flow_error',when:'ошибка перехода или пополнения',extra:{error_code:'string'}}]};}
function report(){return `# Итоговый отчёт — СИНТЕТИЧЕСКИЕ ДАННЫЕ\n\nКоманда: ${a('team')}\nДата: ${stamp()}\n\n## Проверяли\nБарьер: ${a('barrier')}\nИзменение: ${a('change')}\nМеханизм: ${a('mechanism')}\n\n## Фиксированные результаты бизнес-кейса\n| Показатель | A | B |\n|---|---:|---:|\n| Назначены | 10 000 | 10 000 |\n| Кликнули | 800 (8%) | 1 200 (12%) |\n| Пополнили >=1000 за 7 дней | 500 (5%) | 510 (5,1%) |\n| Пользователи с тех. ошибкой | 20 (0,2%) | 22 (0,22%) |\nРазница +0,1 п. п.; прибл. 95% ДИ [-0,51; +0,71] п. п. Убедительный рост пополнений не подтверждён; отсутствие подтверждения не доказывает ровно нулевой эффект. Аналитик не обнаружил критичных проблем качества.\n\nЭТО НЕ РЕЗУЛЬТАТ ФАКТИЧЕСКОГО ТЕХНИЧЕСКОГО ЗАПУСКА НА СОТРУДНИКАХ.\n\n## Интерпретация\n${a('learning')}\n## Решение\n${a('decision')}\n## Рекомендация / следующий шаг\n${a('next')}\n\n## Для заполнения аналитиком GH\nРаздел «Итоги эксперимента»: достигнут ли статистический эффект Да/Нет; статистическая значимость и величина; выводы; рекомендации; свободные итоги/ограничения. Alpha 0,05, beta 0,2 — параметры подсказки, не доказательство эффекта. При наличии — ссылка на superset.\n\n## После эксперимента\n${a('followup')}\n\n## Подтверждения участника\n${externalMD()}\n`;}
function retro(){return `# Обратная связь о платформе\n\nКоманда: ${a('team')}\nЭксперимент: ${a('draftRef')}\n\nУкажите действия, ожидаемый и фактический результат. Скриншоты при необходимости оставьте в рабочей системе.\n\nНастройка: ${a('draftPain')}\nТестовый экран: ${a('qaPain')}\nМодерация: ${a('moderationPain')}\nВыкат: ${a('launchPain')}\nЗавершение: ${a('stopObservation')}\n\n## Наблюдения\n1. ${a('friction1')}\n2. ${a('friction2')}\n3. ${a('friction3')}\n\n## Приоритет и проверка пользы\n${a('priority')}\nПередача в бэклог: ${a('backlogRef')}\nОбратная связь: ${a('feedbackRef')}\n\nВременный канал по инструкции: «Предложения» в Confluence, до появления отдельной формы. Рабочая ссылка/FAQ/контакты — из исходного документа.\n`;}
function variantHTML(variant){const h=variant==='A'?'Пополнить накопительный счёт':a('headline');return `<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Учебный вариант ${variant}</title><style>body{font:16px/1.6 system-ui;background:#f4f4ee;color:#172c28;max-width:500px;margin:60px auto;padding:24px}button{font:inherit;background:#225c47;color:white;border:0;padding:16px 22px;border-radius:12px;cursor:pointer}output{display:block;margin-top:20px}</style><p>УЧЕБНЫЙ МАКЕТ · ${variant} · виджет-кнопка</p><button id="cta">${esc(h)}</button><output id="out" aria-live="polite"></output><p>Не выполняет денежные операции, не подключён к АМ или аналитике. Рабочий диплинк подтверждает владелец сценария.</p><script>document.getElementById('cta').onclick=function(){document.getElementById('out').textContent='Учебная иллюстрация перехода. Реальный сценарий не подключён.';};<\/script></html>`;}
function download(k){let text,name,type='text/markdown;charset=utf-8';switch(k){case'jira':text=jira();name='jira-project.md';break;case'card':text=cardFields();name='platform-fields.md';break;case'runbook':text=runbook();name='launch-runbook.md';break;case'risks':text=risks();name='corner-cases.md';break;case'passport':text=passport();name='experiment-passport.md';break;case'spec':text=spec();name='page-specification.md';break;case'audience':text=audience();name='audience.md';break;case'events':text=JSON.stringify(events(),null,2);name='events.json';type='application/json';break;case'variantA':case'variantB':text=variantHTML(k==='variantA'?'A':'B');name=k==='variantA'?'variant-a.html':'variant-b.html';type='text/html;charset=utf-8';break;case'report':text=report();name='experiment-report.md';break;case'retro':text=retro();name='platform-retrospective.md';break;case'progress':text=JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2);name='growth-lab-progress.json';type='application/json';break;default:text=passport()+'\n---\n\n'+jira()+'\n---\n\n'+cardFields()+'\n---\n\n'+runbook()+'\n---\n\n'+risks()+'\n---\n\n'+spec()+'\n---\n\n'+audience()+'\n---\n\n'+report()+'\n---\n\n'+retro();name='growth-lab-case.md';}const blob=new Blob([text],{type});const u=URL.createObjectURL(blob);const link=document.createElement('a');link.href=u;link.download=name;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);toast('Скачивается '+name);}
function cleanState(o){if(!o||![1,2].includes(o.version)||!o.data||typeof o.data!=='object'||Array.isArray(o.data))throw Error('Неподдерживаемый формат');const legacy=o.version===1;const keys=new Set(steps.flatMap(s=>(s.fields||[]).map(x=>x.id)).concat(['platform','mode','tour','migration','copy','cta'],steps.map((_,i)=>'q'+i)));const data={mode:'platform'};for(const [k,v] of Object.entries(o.data)){if(keys.has(k)&&typeof v==='string'&&v.length<=12000&&!legacy||legacy&&keys.has(k)&&typeof v==='string'&&v.length<=12000&&!/^q\d+$/.test(k))data[k]=v;}if(!['platform','review'].includes(data.mode))data.mode='platform';if(data.platform&&!safeURL(data.platform))data.platform='';if(data.mode!=='review')data.tour='no';const ints=x=>Array.isArray(x)?[...new Set(x.filter(n=>Number.isInteger(n)&&n>=0&&n<END))]:[];const bools=(obj,allowed)=>obj&&typeof obj==='object'?Object.fromEntries(Object.entries(obj).filter(([k,v])=>allowed.has(k)&&typeof v==='boolean')):{};const selfKeys=new Set(steps.flatMap((s,n)=>(s.rubric||[]).map((_,i)=>n+'_'+i)));const externalKeys=new Set(Object.entries(extChecks).flatMap(([k,v])=>v.map((_,i)=>k+'_'+i)));const clean={version:2,current:0,data,done:legacy?[]:ints(o.done),reviewed:legacy?[]:ints(o.reviewed),self:legacy?{}:bools(o.self,selfKeys),external:legacy?{}:bools(o.external,externalKeys),attempts:{},updated:typeof o.updated==='string'?o.updated:'',legacyAnswers:legacy?Object.fromEntries(Object.entries(o.data).filter(([k,v])=>typeof v==='string'&&v.length<=12000)):o.legacyAnswers||{}};if(legacy)data.migration='yes';let max=0;while(clean.done.includes(max)&&max<END)max++;if(data.mode==='review'&&data.tour==='yes')max=END;clean.current=Math.max(0,Math.min(Number.isInteger(o.current)&&!legacy?o.current:0,max));return clean;}
function toast(t){document.querySelector('.toast')?.remove();const e=document.createElement('div');e.className='toast';e.role='status';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),3500);}
function openModal(title,html){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=html;document.getElementById('modal').showModal();document.querySelectorAll('#modal [data-download]').forEach(b=>b.onclick=()=>download(b.dataset.download));}
function settings(){openModal('Настройки и прогресс',`<div class="field"><label for="setPlatform">Адрес вашей платформы</label><input id="setPlatform" type="url" value="${esc(val('platform'))}" placeholder="https://…"></div><div class="field"><label for="setMode">Режим прохождения</label><select id="setMode"><option value="platform" ${val('mode')==='platform'?'selected':''}>С платформой</option><option value="review" ${val('mode')==='review'?'selected':''}>Обзор без обязательного запуска</option></select></div><label class="check"><input id="setTour" type="checkbox" ${val('tour')==='yes'?'checked':''}><span>Свободно открыть все шаги в режиме обзора. Это не засчитывает прохождение.</span></label><br><button class="primary" id="saveSettings">Сохранить настройки</button><p class="hint" style="font-size:12px;margin-top:12px">При переходе из обзора в практику вернём вас к первому неподтверждённому заданию в платформе.</p><hr style="border:0;border-top:1px solid var(--line);margin:25px 0"><h3>Перенести прогресс</h3><p style="font-size:13px">Скачайте JSON, затем откройте его здесь на другом компьютере. Импорт заменит текущие ответы после подтверждения.</p><button class="download" data-download="progress">Скачать прогресс · JSON</button><label class="download" style="display:inline-block;margin:8px 0;cursor:pointer" for="importFile">Выбрать JSON для импорта</label><input id="importFile" type="file" accept="application/json,.json" class="sr-only"><div id="importStatus" role="status"></div><hr style="border:0;border-top:1px solid var(--line);margin:25px 0"><h3>Начать заново</h3><p style="font-size:13px">Удаляет ответы только из этого браузера. Сначала можно скачать резервную копию.</p><button class="quiet" id="resetBtn">Сбросить прогресс…</button><div id="resetConfirm"></div>`);document.getElementById('saveSettings').onclick=()=>{const u=document.getElementById('setPlatform').value.trim();if(u&&!safeURL(u)){toast('Нужен полный http:// или https:// адрес.');return;}state.data.platform=u;state.data.mode=document.getElementById('setMode').value;state.data.tour=document.getElementById('setTour').checked?'yes':'no';invalidateExternal();save();document.getElementById('modal').close();render();};document.getElementById('importFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>1000000)throw Error('Файл больше 1 МБ.');const incoming=cleanState(JSON.parse(await file.text()));const box=document.getElementById('importStatus');box.innerHTML=`<p style="font-size:13px">Файл команды «${esc(incoming.data.team||'без названия')}». Заменить текущие ответы?</p><button class="primary" id="confirmImport">Заменить ответы</button>`;document.getElementById('confirmImport').onclick=()=>{state=incoming;invalidateExternal();save();document.getElementById('modal').close();render();toast('Прогресс восстановлен.');};}catch(err){document.getElementById('importStatus').textContent='Не удалось импортировать: '+err.message;}};document.getElementById('resetBtn').onclick=()=>{document.getElementById('resetConfirm').innerHTML='<p style="font-size:13px">Точно удалить все локальные ответы?</p><button class="primary" id="confirmReset">Да, удалить и начать заново</button>';document.getElementById('confirmReset').onclick=()=>{state={version:2,current:0,data:{mode:'platform'},done:[],reviewed:[],self:{},attempts:{},external:{},updated:''};save();document.getElementById('modal').close();render();};};}
document.getElementById('sidebar').addEventListener('click',e=>{const b=e.target.closest('[data-step]');if(b)go(Number(b.dataset.step));});document.getElementById('menuBtn').onclick=()=>{const open=document.getElementById('sidebar').classList.toggle('open');document.getElementById('menuBtn').setAttribute('aria-expanded',String(open));};document.getElementById('closeModal').onclick=()=>document.getElementById('modal').close();document.getElementById('settingsBtn').onclick=settings;document.getElementById('materialsBtn').onclick=()=>openModal('Материалы урока',artifactPanel('Скачать из текущих ответов',['passport','jira','card','spec','audience','events','variantA','variantB','runbook','report','retro','risks','all','progress'])+`<details><summary>Памятка ведущему · содержит спойлеры</summary><ol class="list"><li>Подготовьте доступы, белый список и команду тестирования, непересекающиеся готовые .txt на уведомлённых сотрудников, рабочий диплинк, согласования и окно выката.</li><li>Планируйте две встречи с паузой на внешние зависимости. Для просмотра любого шага включите обзор и свободную навигацию в настройках.</li><li>Для основного кейса используйте виджет-кнопку: заголовок и согласованный диплинк, без нового лендинга и изображения. При выборе карточки новые картинки проходят через саппортов.</li><li>Меняйте исполнителя за компьютером; фиксируйте время ожидания и обращения за помощью.</li><li>В письменных ответах нет единственно правильного текста. Обсуждайте механизм и критерии.</li><li>Финал: клики 8% → 12%, пополнения 5% → 5,1%; положительный эффект по главной метрике не подтверждён.</li><li>Приоритет ретроспективы — одно улучшение с наблюдаемой причиной и способом проверки.</li></ol></details><p style="font-size:12px;color:var(--muted)">Пустые поля попадут в документы как «не заполнено». Эти выгрузки не являются завершёнными артефактами, пока команда не ответила на соответствующие вопросы.</p>`);
function jira(){return `# Заготовка проекта Jira\n\nBoard: GH Project\nIssue Type: Project\nLabels: команда, если известна\nEpic Link: текущий квартальный эпик уточнить у PM; не копировать пример со скриншота\n\nЦель: ${a('problem')}\nМетрика: ${a('metric')}\nЦелевая аудитория: ${a('include')}\nИсключения: ${a('exclude')}\nПотенциальный экономический эффект и основания: ${a('economics')}\nПримерный срок внедрения, помощь GH, зависимости: ${a('implementation')}\nЗаказчик и КП: ${a('ownerCP')}\nФактический учебный охват: ${a('audienceReceipt')}\n\n## Материалы / Description\nВиджет-кнопка, Android, Главный экран.\nA: Пополнить накопительный счёт\nB: ${a('headline')}\nСсылка / подтверждение: ${a('deeplink')}\nПредпосылки и исследования: ${a('cardPremise')}\nОжидаемое влияние: ${a('mechanism')}\nРасписание: ${a('schedule')}\n\nПредварительная экономика не равна фактическому эффекту. Примерно через два месяца после теста GH уточняет внедрение и его реальный результат.\nПараметры Jira и платформы должны совпадать.\n`;}
function cardFields(){return `# Поля платформы — ручной перенос\n\nНазвание: Проверка нового текста виджета накопительного счёта\nАвтор: проверить отображаемого автора; на примере инструкции поле заблокировано.\nТип: обсудить «Существующее решение» для изменения текущего сценария.\nЦель: Выявляющий / Подтверждающий — с аналитиком.\nТэги: Главный экран; продукт; поведение/транзакции; сегмент по методологии N2B/Active/Sleep/Reactive/Winback/Longsleep.\n\n## Бизнес цель (${val('cardGoal').length}/500)\n${a('cardGoal')}\n\n## Предпосылки (${val('cardPremise').length}/500)\n${a('cardPremise')}\n\n## Что тестируем? (${val('cardTest').length}/500)\n${a('cardTest')}\n\n## Гипотеза (${val('cardHypothesis').length}/500)\n${a('cardHypothesis')}\n\n## Расписание и роли\n${a('schedule')}\nНачало и конец — даты и двухчасовые интервалы; не обещать точную минуту запуска.\nБелый список включает администратор. В каждой команде тестирования обязательны Кирилл К. и Яков Л.\n\n## Аудитория\nAndroid; реальное общее число сотрудников; количество вариантов включая контроль подгружается из вариантов. Прирост 15% -> 18% вводится 3/3% (процентные пункты). Для неизвестного baseline уточнить аналитика; не копировать «1» из примера.\n\n## Материалы\n${spec()}\n`;}
function runbook(){return `# Контрольный маршрут по инструкции 2.3\n\n1. Доступ: АЛЬФА-МЕТРИКА, Superset / Альфа-Метрика.UI, редактор АБ-платформы. Белый список для тестового экрана отдельно.\n2. Jira: GH Project / Project; текущий Epic Link у PM; все обязательные сведения и материалы.\n3. Аналитик: метрики, события, источники/таблицы/доступы, группы, размер, длительность, оценка; заказчик организует доступы. Владелец чужого сценария согласует размещение. Редполитика действует и на сотрудников; нестандартное — с рисками.\n4. Онбординг однократный: уведомлённые выбранные сотрудники, без клиентов. БЗРБ необязательна. Тестовый экран обязателен для каждого будущего теста.\n5. Карточка: Об эксперименте / Аудитория / Варианты теста. 4 описания по 500 символов; заголовок виджета 200.\n6. Расписание: двухчасовые интервалы начала и окончания. В команде тестирования обязательны Кирилл К. и Яков Л.; свой проверяющий из белого списка.\n7. Аудитория: готовые .txt от аналитика, уникальные списки вариантов; нет пересечений с другими действующими тестами. Формат .txt уточняется Q4. Один виджет на участника.\n8. Варианты: кнопка (заголовок + диплинк) / карточка (заголовок + ссылка на картинку + диплинк); новые картинки через саппортов. Проверить число CUS после загрузки и сохранения.\n9. Сохранить -> индикатор Сохранён -> Проверить черновик. Исправить -> сохранить -> проверить снова. «Заполнен» != «Сохранён» != проверка модератора.\n10. Тестовый экран в боевом АМ: каждый вариант, внешний вид, нажатия, диплинк, весь сценарий; с аналитиком сбор событий. Предпросмотр этого не заменяет.\n11. Только для клиентов: опубликованная доступная статья в Абуке / БЗРБ (не заявка); после создания заявки упомянуть CX-эксперта направления в комментариях.\n12. Готов к запуску -> Запустить эксперимент (отправка на модерацию). Возврат На доработку: прочитать причину, исправить, сохранить, повторить доступные проверки/отправку. После согласования Ожидает выката -> запуск по выбранному интервалу. Пропущенное окно уточнить с GH.\n13. После запуска: Android, Главный экран боевого АМ под включённым сотрудником. Виджет, переход, сценарий и сбор аналитики.\n14. Один участник: поиск По CUS клиента -> нужный Запущен -> Варианты теста -> вручную вводить КУС по вариантам -> Отключить ID -> уведомление/подтверждение/Включить ID. Это не Остановить. Возврат при согласованной необходимости в том же варианте.\n15. Завершение: автоматически по дате/времени или Остановлен по принятому решению с GH. Не обещать неподтверждённое поведение старого интерфейса.\n16. Итоги заполняет аналитик GH: эффект Да/Нет, величина/статистическая оценка, выводы, рекомендации, свободные итоги; ссылка superset если заполнена. Заказчик знакомится и согласует действия.\n17. Примерно через два месяца: GH уточнит внедрение и фактический эффект. Предварительная экономика != фактический доход.\n18. Обратная связь: Предложения в Confluence до новой формы. Название эксперимента, действия, ожидание, факт, скриншот при необходимости.\n\n## Реальные подтверждения участника\n${externalMD()}\n\nИсточник: ${SOURCE}\n`;}
function risks(){return `# Опасные ситуации и открытые вопросы\n\n## Проверки\n- iOS/Web или другой экран виден в UI, но пока не поддержан. Только Android/Главный экран, включая сотрудников.\n- Онбординг и тестовый экран работают в боевом АМ, не в отдельной тестовой среде.\n- Предпросмотр != тестовый экран; тестовый экран != полный однократный онбординг.\n- Editor != белый список; команда тестирования != аудитория после выката.\n- Сотрудники/модераторы не исключены из запрета пересечений КУСов. История завершённых тестов != текущее участие.\n- Файлы и деление готовит аналитик; не предполагать встроенную сегментацию/рандомизацию.\n- Прирост вводится в п. п.: 15 -> 18 даёт 3, а не 20. Неизвестный baseline согласовать.\n- «Заполнен» != «Сохранён»; сначала сохранить, потом проверить черновик.\n- Запустить != мгновенный показ: модерация -> Ожидает выката -> расписание -> проверка выдачи.\n- На доработку: причина, исправление, сохранение, повторные проверки/отправка.\n- Для клиентов БЗРБ = опубликованная доступная статья + упоминание CX в заявке, не только номер заявки. Для онбординга сотрудников исключение.\n- Общий поиск CUS находит тест, не вариант. Первый вариант без участника не опровергает участие в тесте.\n- Отключить ID != остановить всех. Подтверждение отключения, кнопка Включить ID; повторно включать по необходимости.\n- Итоги заполняет аналитик GH; отсутствие результатов сразу после завершения может быть ожиданием его работы.\n- Рост кликов != рост главной метрики; потенциальная экономика != эффект внедрения.\n\n## Открытые вопросы источника\nQ1: временный канал Предложения в Confluence; сменить после новой формы.\nQ3: подтвердить аналитика/порядок назначения, не назначать по одному упоминанию.\nQ4: .txt подтверждён, разделитель/кодировка/заголовок/пример не утверждены; договориться о подтверждении пройденного онбординга.\nQ6: редполитика уже есть в версии 2.3, место фиксации согласования рисков ещё открыто.\nQ7: индивидуальное отключение описано; статистика жалоб, эскалация, ответственный за общую остановку и сроки не подтверждены.\n\n## Вопросы команды\n${a('openQuestions')}\n`;}
function migrateLocal(){try{const current=localStorage.getItem(KEY);const legacy=localStorage.getItem('growth-lab-v1');if(current)state=cleanState(JSON.parse(current));else if(legacy){state=cleanState(JSON.parse(legacy));save();}}catch(e){storageOK=false;}}
migrateLocal();
render();
</script>
