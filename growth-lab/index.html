<header><div class="brand"><span class="brand-mark" aria-hidden="true">↗</span><div>Growth Lab<small>Практика экспериментов</small></div></div><div class="top-actions"><span class="save-state" id="saveState" role="status">Прогресс сохраняется в браузере</span><button class="quiet mobile-nav" id="menuBtn" aria-expanded="false" aria-controls="sidebar">Шаги</button><button class="quiet" id="materialsBtn">Материалы</button><button class="quiet" id="settingsBtn">Настройки</button></div></header>

<dialog id="modal"><div class="modal-head"><h2 id="modalTitle"></h2><button class="quiet" id="closeModal" aria-label="Закрыть окно">Закрыть</button></div><div id="modalBody"></div></dialog><div class="sr-only" id="announce" aria-live="polite"></div>
<script>
'use strict';
const KEY='growth-lab-v2';
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const msg=(name,text)=>`<div class="message"><div class="person"><span class="avatar">${esc(name.slice(0,1))}</span><span>${esc(name)} · учебный персонаж</span></div>${text}</div>`;
const note=(text,warning=false)=>`<div class="note ${warning?'warning':''}">${text}</div>`;
const f=(id,label,placeholder='',hint='',type='textarea')=>({id,label,placeholder,hint,type});
const legacyExtChecks={};
const steps=[
{title:'Вы — growth-команда',short:'Получить задачу',phase:'Вводные',time:'5 минут',lead:'Сегодня вы поменяетесь местами с пользователем своей платформы. Ваша задача — придумать и провести первый эксперимент.',body:()=>`<div class="hero"><div class="eyebrow" style="color:#a6c3a6">Один кейс · весь путь</div><h2>Счёт открыли.<br>Копить не начали.</h2><p>Помогите клиентам сделать первое пополнение накопительного счёта. И узнайте, насколько удобно проводить такой тест вашей платформой.</p><div class="hero-path"><span>Придумать</span><span>Подготовить</span><span>Запустить</span><span>Принять решение</span></div></div><div class="cards stats"><div class="card"><span class="big">15</span><span class="small">шагов в истории</span></div><div class="card"><span class="big">≈ 3 ч</span><span class="small">с подготовленной платформой</span></div><div class="card"><span class="big">4</span><span class="small">выхода в вашу платформу</span></div></div>${note('Урок даёт задания и собирает артефакты. Создание, настройка и запуск выполняются вами в вашей платформе. Выполнение отмечаете сами; автоматической проверки внешних действий здесь нет.')}`,fields:[f('team','Как назвать вашу команду?','Например: Команда экспериментов','','text')],rubric:['Договорились менять исполнителя за компьютером между этапами.'],feedback:'Ваша цель — пройти весь процесс и заметить затруднения. Свободные ответы вы будете проверять сами по критериям; автоматическая проверка есть только у вопросов с выбором.',special:'setup'},
{title:'Какой результат нужен бизнесу?',short:'Выбрать цель',phase:'Задача',time:'10 минут',lead:'Руководитель просит «увеличить вовлечение в накопления». Прежде чем менять экран, переведите просьбу в наблюдаемое поведение.',body:()=>msg('Ирина, руководитель продукта','<p>«Клиенты открывают накопительный счёт, но оставляют его пустым. Хочется, чтобы они начали пользоваться накоплениями. Ставки и условия продукта менять пока нельзя».</p>')+`<div class="cards stats"><div class="card"><span class="big">5%</span><span class="small">пополняют счёт за 7 дней</span></div><div class="card"><span class="big">1 000 ₽</span><span class="small">минимум для целевого действия</span></div><div class="card"><span class="big">2</span><span class="small">варианта в эксперименте</span></div></div>`+note('Все данные, отзывы и результаты в кейсе вымышлены. Условия задания — учебные, а не сведения о продуктах конкретного банка.'),quiz:{q:'Какой результат лучше отвечает задаче?',options:['Увеличить число нажатий на карточку','Увеличить долю клиентов, пополнивших счёт минимум на 1 000 ₽ за 7 дней','Сделать страницу заметнее','Запустить эксперимент без технических ошибок'],correct:1,explain:['Клик помогает понять интерес, но после него клиент может так и не пополнить счёт.','Да. Это действие клиента, связанное с использованием продукта. В этом уроке оно станет главной метрикой.','Заметность — предполагаемый механизм, а не итоговый результат для бизнеса.','Корректный запуск необходим, но сам по себе ещё не означает пользы для продукта.']},fields:[f('problem','Опишите проблему одним-двумя предложениями','Что происходит с клиентами и какое поведение хотите изменить?')],rubric:['В описании есть текущее и желаемое поведение клиента.'],feedback:'Сначала фиксируем поведение, которое хотим изменить. Из него будут следовать гипотеза и критерий решения.'},
{title:'Почему клиент не пополняет счёт?',short:'Сформулировать гипотезу',phase:'Гипотеза',time:'15 минут',lead:'У вас есть несколько наблюдений. Выберите один предполагаемый барьер и предложите проверяемый способ на него повлиять.',body:()=>`<div class="cards"><div class="card"><p class="quote">Кажется, что начинать надо с большой суммы.</p></div><div class="card"><p class="quote">Счёт открыл, а деньги так и лежат на карте.</p></div><div class="card"><p class="quote">Не понимаю, зачем мне сейчас туда переводить.</p></div></div>${note('Это три учебных наблюдения, а не доказательство распространённости барьера. Вам предстоит выбрать предположение и проверить его. Менять можно только заголовок, пояснение и текст кнопки.')}`,fields:[f('barrier','Какой один барьер вы выбрали?','Клиент не делает действие, потому что…'),f('change','Что вы измените?','Если мы…'),f('mechanism','Почему это должно повлиять на пополнения?','…то клиенту станет проще / понятнее… и поэтому…')],rubric:['Выбрали один барьер, а не перечень всех возможных причин.','Изменение укладывается в текст карточки и кнопки.','Объяснили, почему вырастут пополнения, а не только клики.'],feedback:'Например: если предложить начать с конкретной небольшой суммы, больше клиентов сделают первое пополнение, потому что первый шаг перестанет казаться большим. Другие гипотезы тоже допустимы, если понятен механизм.'},
{title:'Подготовьте два варианта',short:'Написать ТЗ',phase:'Материалы',time:'15 минут',lead:'Контроль остаётся прежним. Для теста опишите ровно то изменение, которым проверите выбранную гипотезу.',body:()=>msg('Олег, подготовка страниц','<p>«Не нужно верстать страницу. Передайте мне заголовок, пояснение, кнопку и описание перехода. Я верну ссылки на варианты вашим обычным способом».</p>')+`<div class="two"><div><div class="eyebrow">A · контроль</div>${mock('Накопительный счёт','Пополняйте счёт в приложении','Пополнить')}</div><div><div class="eyebrow">B · ваш вариант</div><div id="livePreview">${mock(val('headline')||'Ваш заголовок','','Тот же заголовок кнопки')}</div></div></div>`,fields:[f('headline','Заголовок варианта B','Например: Начните копить с 1 000 ₽','','text'),f('copy','Поясняющий текст','Коротко объясните, что получит или сделает клиент.','','text'),f('cta','Текст кнопки','Какое действие предлагает кнопка?','','text'),f('transition','Что происходит после нажатия?','Открывается существующая форма пополнения. Другие шаги не меняются.')],rubric:['Варианты отличаются только согласованными текстами карточки.','Текст не обещает новых ставок, бонусов или условий.','Указали переход; сам процесс пополнения одинаков в A и B.'],feedback:'Для первого кейса достаточно одной интервенции: текста карточки. Не меняйте одновременно ставку, аудиторию, расположение и процесс пополнения — иначе будет трудно объяснить эффект.'},
{title:'Кого включить в эксперимент?',short:'Описать аудиторию',phase:'Аудитория',time:'10 минут',lead:'Собирать список пользователей не нужно. Передайте понятное описание, по которому другой человек сможет подготовить сегмент.',body:()=>note('Учебный бизнес-сегмент: активные клиенты с открытым накопительным счётом и нулевым балансом, без пополнений за последние 30 дней. Назначение в A/B — при первом подходящем визите на главную, до показа варианта. Для фактической тренировки используется отдельный согласованный сегмент сотрудников / тестовых учётных записей.'),fields:[f('include','Критерии включения','Какие признаки должны одновременно выполняться?'),f('exclude','Кого исключить?','Например: нет счёта, уже есть остаток, участвовал в конфликтующем эксперименте…')],quiz:{q:'Что распределять между A и B?',options:['Каждый просмотр страницы независимо','Пользователя с сохранением варианта при повторных визитах','Утром всех в A, вечером всех в B'],correct:1,explain:['Один человек сможет увидеть оба варианта. Для этого кейса нужен стабильный вариант на пользователя.','Верно. В этом кейсе пользователь получает один вариант и сохраняет его при повторных визитах.','Время суток может влиять на поведение. Тогда эффект изменения смешается с различиями аудитории по времени.']},rubric:['Описание позволяет однозначно определить, подходит ли пользователь.','Учебный сегмент для реального запуска отделён от бизнес-аудитории кейса.'],feedback:'Не требуется SQL или файл с клиентскими ID. Требуется понятный контракт на аудиторию и единицу рандомизации.'},
{title:'По чему примете решение?',short:'Задать метрики',phase:'Метрики',time:'15 минут',lead:'Одна метрика отвечает на вопрос об успехе. Остальные помогают объяснить результат и заметить ошибки.',body:()=>`<div class="table-wrap"><table><thead><tr><th>Роль</th><th>Что смотрим</th></tr></thead><tbody><tr><td>Главная</td><td>Пополнение ≥ 1 000 ₽ за 7 дней</td></tr><tr><td>Диагностическая</td><td>Клик на карточку</td></tr><tr><td>Защитная</td><td>Ошибки перехода / пополнения</td></tr><tr><td>Качество данных</td><td>Распределение A/B, дубли и потеря событий</td></tr></tbody></table></div>`,quiz:{q:'Как считать главную метрику?',options:['Пополнения / нажавшие на карточку','Уникальные пользователи с целевым пополнением / все подходящие пользователи, назначенные в группу','Число всех переводов / число показов'],correct:1,explain:['Нажатие зависит от варианта. Сравнение только кликнувших меняет состав сравниваемых групп и не оценивает общий эффект карточки.','Да. Пользователя учитываем один раз в знаменателе и максимум один раз в числителе. Окно — семь дней от назначения.','У одного человека бывает несколько показов и переводов. Здесь нужна пользовательская конверсия.']},fields:[f('metric','Запишите числитель, знаменатель и окно','Числитель: …\nЗнаменатель: …\nОкно: …'),f('guardrail','Какую техническую проблему нужно заметить?','Какой показатель проверите и что будете делать при сбое?')],rubric:['В числителе уникальные пользователи с пополнением ≥ 1 000 ₽.','Знаменатель включает всех назначенных подходящих пользователей группы.','Окно каждого пользователя — 7 дней от назначения.'],feedback:'События, которые нужны в ТЗ: experiment_assignment, card_view, card_click, qualified_topup и flow_error. Нужны идентификатор эксперимента, пользователь, вариант и время; в урок не вводите реальные клиентские данные.'},
{title:'Зафиксируйте план до запуска',short:'Спланировать тест',phase:'Дизайн',time:'10 минут',lead:'Ведущий играет роль аналитика и выдаёт готовый расчёт. Считать размер выборки вручную в этом уроке не нужно.',body:()=>`<div class="cards stats"><div class="card"><span class="big">50 / 50</span><span class="small">случайное распределение</span></div><div class="card"><span class="big">10 000</span><span class="small">минимум на вариант</span></div><div class="card"><span class="big">14 + 7</span><span class="small">дней набора + наблюдения</span></div></div>${note('План для кейса: baseline 5%, целевой обнаруживаемый эффект +1 п. п., двусторонний уровень значимости 5%, мощность не ниже 80%. Минимум 10 000 на группу — округлённый учебный объём с запасом. Если за 14 дней выборка не набрана, объявить победителя по текущим данным нельзя: нужно вернуться к аналитику и плану.')}`,quiz:{q:'Когда подводить итог по эффективности?',options:['Как только вариант B обгонит A','Через 14 дней, не ожидая последних участников','После выполнения плана набора и завершения 7-дневного окна последних участников'],correct:2,explain:['Поиск удобного момента для остановки может дать ошибочный вывод. Для кейса придерживаемся заранее выбранного плана.','У последних участников ещё не закончилось окно конверсии. Группы нужно сравнивать на созревших данных.','Верно. Контроль качества идёт во время теста, а итог эффективности — по заранее заданному плану и созревшим окнам.']},fields:[f('stop','В каких случаях остановите запуск досрочно?','Опишите технические сбои или риски, при которых нужно вмешаться.')],rubric:['Различили остановку из-за сбоя и остановку ради красивого результата.','Принятие решения опирается на главную метрику, качество данных и защитные показатели.'],feedback:'Для учебного решения: внедрение обсуждаем при подтверждённом положительном эффекте по главной метрике, приемлемой практической пользе и отсутствии недопустимых ухудшений. Значимость сама по себе не оценивает ценность изменения.'},
{title:'Создайте черновик на платформе',short:'Создать черновик',phase:'Платформа · 1 / 4',time:'20 минут',external:'draft',lead:'Ваши ответы уже превратились в пакет для запуска. Теперь передайте его в ту систему, которую разрабатывает ваша команда.',body:()=>artifactPanel('Пакет подготовки',['passport','spec','audience','events','variantA','variantB'])+route()+`<ol class="list"><li>Скачайте паспорт, ТЗ, описание аудитории и события.</li><li>Создайте эксперимент и перенесите материалы в доступные поля / вложения.</li><li>Получите реальные ссылки на страницы через принятый в команде процесс.</li><li>Если поля или загрузки нет, используйте существующий обходной путь и запишите затруднение.</li></ol>${note('HTML-заготовки A/B демонстрируют тексты и клики. Они не переводят деньги и не подключены к событиям вашей платформы. Для запуска их нужно разместить и подключить вашим обычным способом. ТЗ можно использовать вместо HTML.')}`,fields:[f('draftRef','Ссылка или код черновика','Например: EXP-123 или https://…','В режиме «С платформой» требуется ссылка или внутренний код.','text'),f('draftPain','Что затруднило создание черновика?','Что пытались сделать → где застряли → как продолжили. Если проблем не было, так и напишите.')],feedback:'На этом шаге важен реальный маршрут пользователя: сколько пришлось переносить вручную, что непонятно без автора платформы, где понадобилась другая система.'},
{title:'Убедитесь, что тест проверяет гипотезу',short:'Проверить подготовку',phase:'Платформа · 2 / 4',time:'15 минут',external:'qa',lead:'Статус «Готов» ещё не отвечает на вопрос, что увидит клиент и попадут ли его действия в анализ.',body:()=>msg('Нина, аналитик','<p>«Покажите мне один полный тестовый проход: назначение в вариант → показ → клик → целевое событие. И отдельно — пользователя, который не должен попасть в эксперимент».</p>')+route()+note('Проверку проводят на согласованных тестовых учётных записях. В уроке сохраните ссылку на проверку или обезличенный код. Скриншоты и технические логи остаются в ваших рабочих системах.'),fields:[f('qaRef','Ссылка или код подтверждения проверки','Код задачи, ссылка на протокол или запись проверки.','','text'),f('qaPain','Где проверка потребовала ручной работы?','Что проверяли, каким способом и чего не хватило?')],feedback:'Если нужное событие нельзя проверить или непонятно, кто видит вариант, это повод сначала устранить проблему запуска. В режиме работы с платформой отмечайте только действительно выполненные проверки.'},
{title:'Запустите и остановите учебный тест',short:'Пройти запуск',phase:'Платформа · 3 / 4',time:'20 минут',external:'launch',lead:'Пройдите настоящий маршрут публикации на подготовленном учебном сегменте. Затем завершите учебный запуск и проверьте, что остановка сработала.',body:()=>route()+note('Этот технический запуск не нужен для набора 20 000 пользователей и оценки бизнес-эффекта. Он проверяет работу вашей платформы. Результаты клиентского A/B-теста вы получите дальше отдельным учебным пакетом.')+`<ol class="list"><li>Убедитесь, что выбраны реальные ссылки и согласованный учебный сегмент.</li><li>Пройдите обычный маршрут согласования и публикации.</li><li>Проверьте, что варианты доступны назначенным тестовым пользователям.</li><li>Остановите учебный тест и убедитесь, что произошло ожидаемое изменение выдачи.</li></ol>`,fields:[f('runRef','Ссылка или код проведённого запуска','Например: ссылка на эксперимент с историей статусов.','','text'),f('launchPain','Что оказалось непонятным при запуске или остановке?','Статусы, ответственность, ожидание, проверка публикации…')],feedback:'Теперь у вас есть опыт не только настройки, но и управления жизненным циклом эксперимента. Урок сохраняет ваше ручное подтверждение; фактический статус нужно проверять в платформе.'},
{title:'«Клики выросли. Может, хватит?»',short:'Проверить ход теста',phase:'Промежуточные данные',time:'5 минут',lead:'Вернёмся к вымышленному клиентскому тесту. Прошло три дня. В командном чате появилось сообщение.',body:()=>msg('Ирина, руководитель продукта','<p>«У B кликабельность уже 12%, у контроля — 8%. Отличный результат! Давайте сегодня включим новый текст всем?»</p>')+note('Аналитик сообщает: назначение A/B и события корректны, заметных технических ухудшений нет. План набора и 7-дневные окна ещё не завершены.'),quiz:{q:'Как ответите?',options:['Согласимся: рост кликов на 50% достаточно убедителен','Продолжим тест по плану и дождёмся главной метрики с полными окнами','Досрочно остановим: пополнения ещё не выросли'],correct:1,explain:['Клики — диагностическая метрика. Они не подтверждают рост пополнений, а план измерения ещё не выполнен.','Да. Следим за качеством и безопасностью, но не объявляем эффективность по незавершённым данным и вторичной метрике.','Пока не закончилось окно измерения, отсутствие раннего роста тоже не основание объявлять неуспех.']},fields:[f('interim','Напишите короткий ответ руководителю','2–3 предложения: что видим, чего пока не знаем и что делаем.')],rubric:['Признали рост интереса, но не назвали его бизнес-успехом.','Объяснили ожидание главной метрики и полных окон.'],feedback:'«Клики действительно выросли. Но наша цель — пополнение счёта. Дождёмся выполнения плана и семидневных окон, параллельно продолжая проверять корректность теста».'},
{title:'Что на самом деле изменилось?',short:'Разобрать результат',phase:'Результат',time:'15 минут',lead:'Набор завершён, у всех участников прошло семь дней. Аналитик проверил качество данных. Примите решение по этим результатам.',body:()=>resultTable()+msg('Нина, аналитик','<p>«Распределение групп соответствует плану, критичных проблем сбора данных не обнаружено. По главной метрике разница <strong>+0,1 п. п.</strong>; приблизительный 95%-й доверительный интервал — <strong>от −0,51 до +0,71 п. п.</strong> Убедительного положительного эффекта не обнаружили».</p>')+note('Это фиксированные синтетические результаты для разбора. Они не зависят от вашей формулировки гипотезы и не являются результатом фактического запуска на сотрудниках.'),quiz:{q:'Какой вывод обоснован?',options:['Внедряем: клики выросли на 50%','Новый текст точно не влияет на пополнения','Рост пополнений не подтверждён; клики выросли, причину разрыва нужно исследовать','Гипотеза доказана: 5,1% больше 5%'],correct:2,explain:['Рост кликов не заменяет главную метрику. Для внедрения ради пополнений доказательств пока нет.','Интервал включает небольшие положительные и отрицательные эффекты. «Не подтвердили» не означает «доказали полное отсутствие».','Верно. Данные показывают рост кликов, но не дают убедительных оснований заявить рост пополнений. Объяснение механизма потребует нового исследования.','Наблюдаемая разница может объясняться случайными колебаниями. Одного сравнения процентов недостаточно.']},fields:[f('learning','Что узнали и чего пока не знаем?','Разделите наблюдение, вывод и возможное объяснение.')],rubric:['Отделили рост кликов от результата по главной метрике.','Не назвали отсутствие подтверждения доказательством нулевого эффекта.','Не выдали предполагаемую причину за установленный факт.'],feedback:'Можно исследовать путь после клика: непонятные поля, отсутствие свободных денег, несоответствие ожиданиям. Но сам этот эксперимент не позволяет выбрать одну из причин как доказанную.'},
{title:'Зафиксируйте решение',short:'Закрыть эксперимент',phase:'Платформа · 4 / 4',time:'10 минут',external:'report',lead:'Эксперимент заканчивается записью, из которой другой человек поймёт, что проверили, что получили и что будет дальше.',body:()=>artifactPanel('Итоговый отчёт',['report'])+route()+note('Здесь в карточку эксперимента переносится разбор синтетических данных. Отметьте это явно: учебный технический запуск и вымышленный бизнес-результат — разные части упражнения.'),fields:[f('decision','Ваше решение','Внедрять ли вариант ради увеличения пополнений? Почему?'),f('next','Какой следующий шаг?','Что именно исследовать или проверить и какую неопределённость это снимет?'),f('reportRef','Ссылка или код записи с выводом','Карточка эксперимента / ссылка на отчёт / код задачи.','','text')],feedback:'В отчёте должны быть исходная гипотеза, результаты главной и дополнительных метрик, ограничения и действие. Если платформа хранит только настройки запуска, зафиксируйте, куда пришлось вынести вывод.'},
