<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Кредитный помощник · Альфа-Банк</title>
<meta name="description" content="Подберите кредит по цели, сравните платежи и выберите подходящий срок.">
<style>
:root{--ink:#251c29;--muted:#625568;--paper:#f7f4f7;--white:#fff;--line:#e9e0ea;--red:#ad1744;--red-hover:#8f1137;--rose:#fbeaf1;--purple:#573960;--plum:#38263f;--green:#145d47;--warm:#773913}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.44 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #a767b2;outline-offset:3px}
a{color:var(--red);text-underline-offset:3px}
[hidden]{display:none!important}
.shell{width:min(100% - 28px,520px);margin:auto}
.top{background:var(--white);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.top .shell{display:flex;justify-content:space-between;align-items:center;min-height:52px;gap:8px}
.brand{display:flex;align-items:center;gap:8px;font-weight:760;white-space:nowrap}
.brand span{display:grid;place-items:center;width:26px;height:26px;border-radius:8px;background:var(--red);color:#fff;font-size:15px}
.quiet{min-height:44px;border:0;background:transparent;padding:6px;color:var(--purple);font-size:13px;font-weight:700}
.quiet:hover{text-decoration:underline}
main.shell{margin-top:15px;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.progress{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;font-weight:700;margin-bottom:9px}
.meter{display:flex;align-items:center;gap:4px}
.meter i{height:4px;width:17px;border-radius:9px;background:#e6daeb}
.meter i.on{background:#975789}
h1,h2,p,dl{margin:0}
h1{font-size:clamp(25px,7vw,36px);letter-spacing:-.045em;line-height:1.12;text-wrap:balance}
.lead{color:var(--muted);margin:6px 0 14px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:12px 0}
.choice,.pill,.outline,.primary,.inline-go{border-radius:12px;min-height:44px;font-weight:710}
.choice{min-width:0;min-height:54px;text-align:left;padding:7px 9px;border:1px solid var(--line);background:var(--white);color:var(--ink);display:flex;align-items:center;gap:7px;font-size:13px;line-height:1.28}
.choice:hover,.outline:hover,.pill:hover{border-color:#c69ebd;background:#fcf3f8}
.choice b{width:26px;height:26px;display:grid;place-items:center;flex:0 0 26px;border-radius:8px;background:var(--rose);color:var(--red);font-size:17px}
.choice.other{background:#f1e9f4;color:var(--plum);border-color:#e4d7e9}
.quick-text{display:flex;align-items:center;gap:6px;padding:4px;border:1px solid #dfcde1;border-radius:13px;background:var(--white)}
.quick-text input{width:100%;min-width:0;min-height:44px;border:0;background:none;padding:6px 8px;color:var(--ink);font-size:16px}
.inline-go{flex:0 0 44px;line-height:1;border:0;background:var(--red);color:#fff;font-size:23px}
.example,.hint{color:var(--muted);font-size:12px}
.example{margin:5px 0 0 4px}
.sheet,.option{padding:13px;border-radius:15px;border:1px solid var(--line);background:var(--white)}
.sheet{display:grid;gap:12px}
.group{display:grid;gap:5px}
.group label,.group legend{font-weight:700;font-size:14px;color:var(--ink)}
label.field{display:grid;gap:4px;font-size:13px;font-weight:700;color:var(--muted)}
.field input{width:100%;min-width:0;min-height:46px;border:1px solid #ded3e2;border-radius:10px;padding:8px 10px;background:#fff;color:var(--ink);font-size:16px}
fieldset{padding:0;margin:0;border:0;min-inline-size:0}
legend{padding:0;margin-bottom:5px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{border:1px solid var(--line);background:#fff;color:var(--purple);padding:6px 9px;font-size:13px;flex:1 0 auto}
.priorities{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.amounts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.pill[aria-pressed="true"]{background:var(--rose);border-color:#c57294;color:#8a2048}
details summary{cursor:pointer;display:flex;align-items:center;gap:7px;min-height:44px;font-size:14px;font-weight:700;color:var(--purple);list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"+";width:20px;text-align:center;flex-shrink:0}
details[open] summary::before{content:"−"}
.detail-fields,.stack{display:grid;gap:8px}
.primary,.outline{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;text-align:center;padding:8px 11px;line-height:1.25;font-size:14px}
.primary{color:#fff;background:var(--red);border:1px solid var(--red)}
.primary:hover,.inline-go:hover{background:var(--red-hover)}
.outline{border:1px solid #dfd1e2;background:var(--white);color:var(--purple)}
.full{width:100%}
.action-row{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:8px 0}
.context-line{font-size:13px;color:var(--muted);overflow-wrap:anywhere;margin:0 0 9px}
.option{display:grid;gap:7px}
.option.featured{border-color:#c98ba9;background:#fffafb}
.option-top{display:flex;justify-content:space-between;align-items:baseline;gap:6px;flex-wrap:wrap}
.option-top h2{font-size:15px;line-height:1.25}
.term,.mode{white-space:nowrap;color:var(--purple);font-size:12px;font-weight:690}
.mode{display:inline-block;margin-bottom:6px;padding:3px 7px;background:#eee5f1;border-radius:7px}
.big{font-size:clamp(26px,8vw,33px);font-weight:810;letter-spacing:-.06em;line-height:1.1;font-variant-numeric:tabular-nums}
.big small{font-size:13px;font-weight:600;letter-spacing:0;color:var(--muted)}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:6px;border-top:1px solid var(--line);padding-top:7px}
.metrics dt{font-size:12px;color:var(--muted)}
.metrics dd{margin:2px 0 0;font-size:14px;font-weight:760}
.signal{border-radius:9px;padding:7px 9px;background:#fff0e0;color:var(--warm);font-size:13px}
.signal.good{background:#e8f4ee;color:var(--green)}
.fine{color:var(--muted);font-size:12px;margin-top:9px}
.notice{color:#8f1538;font-size:13px}
dialog{padding:13px;width:min(100% - 20px,500px);max-height:calc(100dvh - 30px);border:1px solid var(--line);border-radius:17px;color:var(--ink);box-shadow:0 16px 70px #28123048}
dialog::backdrop{background:#2c16386c}
.dialog-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.dialog-head h2{font-size:20px;letter-spacing:-.035em;line-height:1.17}
.close{border:0;border-radius:10px;background:#f4edf5;color:var(--plum);width:44px;height:44px;flex:0 0 44px;font-size:21px}
.dialog-body{display:grid;gap:8px;margin-top:8px}
.comparison{border-collapse:collapse;width:100%;table-layout:fixed;font-size:13px}
.comparison th,.comparison td{padding:7px 4px;text-align:left;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
.comparison thead th{color:var(--purple)}
.comparison tbody td{font-weight:680}
.comparison tbody tr:last-child{background:#f7f0f7}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
@media(max-width:360px){
 .shell{width:calc(100% - 20px)}
 .top .shell{min-height:46px}
 main.shell{margin-top:10px}
 .lead{margin-bottom:9px;font-size:14px}
 .choices{margin-block:9px}
 .choice{min-height:48px;padding:5px 7px}
 .choice b{flex-basis:22px;width:22px;height:22px}
}
@media(min-width:680px){
 .top .shell{min-height:60px}
 main.shell{margin-top:24px}
 .choice{min-height:58px}
 .sheet,.option{padding:15px}
 .amounts{grid-template-columns:repeat(4,minmax(0,1fr))}
}
</style>
</head>
<body>
<header class="top"><div class="shell"><div class="brand"><span aria-hidden="true">✦</span>Альфа-Банк</div><button id="navigation" class="quiet" type="button" hidden>← Назад</button></div></header>
<main class="shell" id="main"></main>
<dialog id="dialog" aria-labelledby="dialog-title">
 <div class="dialog-head"><h2 id="dialog-title"></h2><button id="close" class="close" type="button" aria-label="Закрыть">×</button></div>
 <div id="dialog-body" class="dialog-body"></div>
</dialog>
<script>
"use strict";
const $ = id => document.getElementById(id);
const products = {
  cash:{name:"Кредит наличными",rate:28.9,source:"https://alfabank.ru/get-money/credit/credit-cash/"},
  refi:{name:"Рефинансирование",rate:26.9,source:"https://alfabank.ru/get-money/credit/refinancing/"},
  auto:{name:"Кредит наличными на автомобиль",rate:27.9,source:"https://alfabank.ru/get-money/autocredit/"}
};
const goals = [
  ["cash","Ремонт или покупка","⌂"],["refi","Погасить кредиты","↻"],
  ["auto","Купить автомобиль","◇"],["other","Другая цель","+"]
];
const presets = [100000,300000,500000,1000000];
const terms = [12,18,24,30,36,42,48,54,60];
const maxAmount = 7500000;
const formatMoney = new Intl.NumberFormat("ru-RU",{maximumFractionDigits:0});
const formatRate = new Intl.NumberFormat("ru-RU",{maximumFractionDigits:2});
const money = value => formatMoney.format(value)+" ₽";
const percent = value => formatRate.format(value)+"%";
const termText = months => months+" мес.";
const esc = value => String(value ?? "").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[char]);
const normalize = text => text.toLowerCase().replaceAll("ё","е");
const main = $("main");
const popup = $("dialog");
let step = 1;
const state={product:"cash",goal:"",opening:"",amount:"",budget:"",context:"",priority:"",payment:"",remaining:"",insurance:false,selected:null};

function annuity(principal,rate,months){
  const monthlyRate=rate/1200;
  return monthlyRate ? principal*monthlyRate/(1-(1+monthlyRate)**-months) : principal/months;
}

function estimate(months,withInsurance=state.insurance){
  const amount=Number(state.amount);
  const fee=withInsurance?Math.round(amount*.13):0;
  const rate=products[state.product].rate-(withInsurance?4:0);
  const payment=annuity(amount+fee,rate,months);
  return {months,fee,rate,payment,total:payment*months,over:payment*months-amount};
}

function productForGoal(text){
  const value=normalize(text);
  if(/рефинанс|(?:закры|погас).{0,18}(?:кредит|долг|карт)/.test(value))return "refi";
  if(/машин|автомобил|автокредит/.test(value))return "auto";
  return "cash";
}

function parseContext(text){
  const value=normalize(text);
  const found={};
  const amounts=/(\d{1,3}(?:[ \u00a0\u202f]\d{3})+|\d+(?:[,.]\d+)?)\s*(млн|тыс(?:яч[аи]?)?\.?|[кk](?![а-яa-z]))?/giu;
  for(const match of value.matchAll(amounts)){
    const unit=match[2];
    const raw=Number(match[1].replace(/\s/g,"").replace(",","."));
    const amount=Math.round(raw*(unit==="млн"?1e6:unit?1e3:1));
    const before=value.slice(Math.max(0,match.index-38),match.index);
    const after=value.slice(match.index+match[0].length).trimStart();
    if(!unit&&/^(?:год[а-я]*|лет(?:$|[\s,.])|мес)/.test(after)){
      const months=raw*(after.startsWith("мес")?1:12);
      if(Number.isInteger(months)&&months>=12&&months<=60)found.months=months;
    }else if(/(?:плат[её]ж[а-я]*|ежемесячно)\s*(?:до|не больше|около|в)?\s*$/.test(before)||/^(?:₽|руб\.?\s*)?\s*(?:в\s+месяц|ежемесячно)/.test(after)){
      if(amount>=1&&amount<=maxAmount)found.budget=amount;
    }else if(amount>=30000&&amount<=maxAmount&&found.amount===undefined){
      found.amount=amount;
    }
  }
  if(/меньше.{0,10}переплат|снизить.{0,10}переплат/.test(value))found.priority="total";
  if(/меньше.{0,10}платеж|снизить.{0,10}платеж|платеж.{0,10}пониже/.test(value))found.priority="payment";
  if(/без\s+страхов/.test(value))found.insurance=false;
  else if(/со\s+страхов/.test(value))found.insurance=true;
  return found;
}

function parameters(){
  const parsed=parseContext(state.context);
  return {
    term:parsed.months,
    budget:Number(state.budget)||parsed.budget||0,
    priority:state.priority||parsed.priority
  };
}

function calculateOptions(){
  const {term,budget,priority}=parameters();
  const defaultTerm=state.product==="auto"?48:36;
  const firstFit=budget?terms.find(months=>Math.round(estimate(months).payment)<=budget):undefined;
  const chosen=term??(priority==="payment"?60:budget?(firstFit??60):priority==="total"?24:defaultTerm);
  const needsLowerPayment=budget&&Math.round(estimate(chosen).payment)>budget;
  const longerAlternative=chosen<60&&(chosen<=24||needsLowerPayment||priority==="total"||(!priority&&!budget));
  const alternative=longerAlternative?Math.min(chosen+12,60):Math.max(chosen-12,12);
  return [estimate(chosen),estimate(alternative)];
}

function progress(){
  const label=step===1?"Цель":step===2?"Параметры":"Варианты";
  return '<div class="progress"><span>'+label+' · '+Math.min(step,3)+' из 3</span><span class="meter" aria-hidden="true">'+[1,2,3].map(n=>'<i class="'+(n<=step?'on':'')+'"></i>').join("")+'</span></div>';
}

function heading(title,subtitle=""){
  return progress()+'<h1 id="step-title" tabindex="-1">'+title+'</h1>'+(subtitle?'<p class="lead">'+subtitle+'</p>':'');
}

function render(focus=true){
  const screens=[goalScreen,detailsScreen,resultScreen,selectionScreen];
  main.innerHTML=screens[step-1]();
  $("navigation").hidden=step===1;
  if(focus){
    window.scrollTo(0,0);
    $("step-title").focus({preventScroll:true});
  }
}

function go(stepNumber){
  if(popup.open)popup.close();
  step=stepNumber;
  render();
}

function goalScreen(){
  return heading("На что нужны деньги?","Кредитный помощник Альфа-Банка")+
    '<div class="choices" aria-label="Цель кредита">'+goals.map(([id,label,mark])=>'<button class="choice '+(id==="other"?"other":"")+'" type="button" data-product="'+id+'"><b aria-hidden="true">'+mark+'</b>'+label+'</button>').join("")+'</div>'+
    '<form class="quick-text" id="goal-form"><label class="sr" for="goal-text">Цель или сумма</label><input id="goal-text" name="opening" type="text" maxlength="250" value="'+esc(state.opening)+'" placeholder="Напишите цель или сумму" required><button class="inline-go" type="submit" aria-label="Продолжить">→</button></form>'+
    '<p class="example">Например, 300 000 ₽ на обучение</p>';
}

function numberField(name,label,value,min,max,required=false,decimal=false){
  return '<label class="field">'+label+'<input type="number" inputmode="'+(decimal?'decimal':'numeric')+'" name="'+name+'" value="'+esc(value)+'" min="'+min+'" max="'+max+'" step="'+(decimal?'any':'1')+'" '+(required?'required':'')+'></label>';
}

function detailsScreen(){
  const refi=state.product==="refi";
  const custom=state.goal==="Другая цель";
  const title=refi?"Какой остаток по кредиту?":"Сколько вам нужно?";
  const preamble=state.goal&&!custom?esc(state.goal):"Укажите сумму. Остальные параметры можно добавить по желанию.";
  return heading(title,preamble)+
    '<form class="sheet" id="parameters-form">'+
      '<div class="group">'+numberField("amount",refi?"Остаток долга, ₽":"Сумма на руки, ₽",state.amount,30000,maxAmount,true)+
      '<div class="pills amounts" aria-label="Быстрый выбор суммы">'+presets.map(value=>'<button class="pill" type="button" data-amount="'+value+'" aria-pressed="'+(Number(state.amount)===value)+'">'+money(value)+'</button>').join("")+'</div></div>'+
      '<fieldset class="group"><legend>Что важнее?</legend><div class="pills priorities">'+
      priorityButton("payment","Снизить платёж")+priorityButton("total","Снизить переплату")+'</div></fieldset>'+
      (refi?'<details '+(state.payment||state.remaining?'open':'')+'><summary>Данные действующего кредита</summary><div class="detail-fields">'+
        numberField("payment","Платёж сейчас, ₽",state.payment,1,maxAmount)+numberField("remaining","Месяцев осталось",state.remaining,1,360)+
        '<p class="hint">Укажите оба значения, чтобы сравнить с рефинансированием.</p></div></details>':'')+
      '<details '+(custom||state.budget||state.context?'open':'')+'><summary>Добавить условия</summary><div class="detail-fields">'+
        numberField("budget","Комфортный платёж до, ₽",state.budget,1,maxAmount)+
        '<label class="field">'+(custom?"Ваша цель или другие условия":"Что ещё учесть")+'<input type="text" name="context" maxlength="250" value="'+esc(state.context)+'" placeholder="'+(custom?'Например, на обучение':'Например, на 3 года без страховки')+'"></label></div></details>'+
      '<p class="notice" id="parameter-error" role="alert" hidden></p>'+
      '<button class="primary full" type="submit">Показать варианты</button></form>';
}

function priorityButton(id,label){
  return '<button class="pill" type="button" data-priority="'+id+'" aria-pressed="'+(state.priority===id)+'">'+label+'</button>';
}

function budgetSignal(estimate){
  const {budget}=parameters();
  if(!budget)return "";
  const difference=Math.round(estimate.payment)-budget;
  return difference>0
    ? '<p class="signal">Выше ориентира на '+money(difference)+' в месяц</p>'
    : '<p class="signal good">В пределах '+money(budget)+' в месяц</p>';
}

function metrics(offer){
  return '<dl class="metrics"><div><dt>Всего выплатите</dt><dd>'+money(offer.total)+'</dd></div><div><dt>Переплата</dt><dd>'+money(offer.over)+'</dd></div></dl>';
}

function optionCard(offer,other,index){
  const label=offer.payment<other.payment?"Платёж ниже":"Переплата ниже";
  return '<article class="option '+(index===0?"featured":"")+'"><div class="option-top"><h2>'+label+'</h2><span class="term">'+termText(offer.months)+'</span></div>'+
    '<p class="big">'+money(offer.payment)+' <small>/ мес.</small></p>'+
    metrics(offer)+budgetSignal(offer)+
    '<button class="'+(index===0?"primary":"outline")+' full" type="button" data-select="'+offer.months+'">Выбрать на '+termText(offer.months)+'</button></article>';
}

function resultScreen(){
  const [a,b]=calculateOptions();
  const amount=money(Number(state.amount));
  const subtitle=products[state.product].name+" · "+amount;
  const details=state.context.trim();
  return heading("Ваши варианты",subtitle)+
    '<span class="mode">Предварительный расчёт</span>'+
    (details?'<p class="context-line">Ваш комментарий: '+esc(details)+'</p>':'')+
    '<div class="stack">'+optionCard(a,b,0)+optionCard(b,a,1)+'</div>'+
    '<div class="action-row"><button class="outline" type="button" data-compare="terms">Сравнить сроки</button><button class="outline" type="button" data-back="2">Изменить параметры</button></div>'+
    (state.product==="refi"?'<button class="outline full" type="button" data-compare="debt">Сравнить с текущим кредитом</button>':'')+
    '<details><summary>Сравнить с другими условиями</summary><div class="stack">'+
      '<button class="outline" type="button" data-compare="insurance">Со страховкой и без</button><button class="outline" type="button" data-compare="bank">С другим банком</button><button class="outline" type="button" data-compare="early">Досрочное погашение</button></div></details>'+
    '<p class="fine">Расчётная ставка '+percent(a.rate)+'. '+(state.insurance?'Страховка учтена. ':'Без страховки. ')+'ПСК и итоговые условия определяет банк.</p>';
}

function selectionScreen(){
  const offer=estimate(state.selected);
  const product=products[state.product];
  return heading("Вариант выбран",product.name)+
    '<article class="option featured"><div class="option-top"><h2>'+money(Number(state.amount))+'</h2><span class="term">'+termText(offer.months)+'</span></div>'+
    '<p class="big">'+money(offer.payment)+' <small>/ мес.</small></p>'+metrics(offer)+budgetSignal(offer)+
    '<p class="fine">Предварительный расчёт. Актуальные условия и заявка доступны на сайте банка.</p>'+
    '<a class="primary full" href="'+product.source+'" target="_blank" rel="noopener">Перейти на сайт Альфа-Банка ↗</a>'+
    '<button class="outline full" type="button" data-back="3">Вернуться к вариантам</button></article>';
}

function modal(title,html){
  $("dialog-title").textContent=title;
  $("dialog-body").innerHTML=html;
  if(!popup.open)popup.showModal();
}

function table(left,right,rows){
  return '<table class="comparison"><thead><tr><th scope="col">Параметр</th><th scope="col">'+left+'</th><th scope="col">'+right+'</th></tr></thead><tbody>'+
    rows.map(([label,a,b])=>'<tr><th scope="row">'+label+'</th><td>'+a+'</td><td>'+b+'</td></tr>').join("")+'</tbody></table>';
}

function tradeoff(shorter,longer){
  return "На "+termText(longer.months)+" платёж ниже на "+money(shorter.payment-longer.payment)+
    " в месяц. Общая сумма выплат выше на "+money(longer.total-shorter.total)+".";
}

function showComparison(kind){
  const [a,b]=calculateOptions();
  switch(kind){
    case "terms":{
      const [shorter,longer]=[a,b].sort((x,y)=>x.months-y.months);
      modal("Сравнение сроков",table(termText(shorter.months),termText(longer.months),[
        ["В месяц",money(shorter.payment),money(longer.payment)],["Переплата",money(shorter.over),money(longer.over)],["Всего",money(shorter.total),money(longer.total)]
      ])+'<p>'+tradeoff(shorter,longer)+'</p><div class="action-row">'+[shorter,longer].map(item=>'<button class="outline" type="button" data-select="'+item.months+'">На '+termText(item.months)+'</button>').join("")+'</div>');
      break;
    }
    case "debt": compareDebt(a);break;
    case "insurance": compareInsurance(a.months);break;
    case "bank":
      modal("Сравнение с другим банком",'<p>Расчёт на ту же сумму '+money(Number(state.amount))+' и срок '+termText(a.months)+'.</p><form class="stack" id="bank-form">'+
        numberField("rate","Ставка другого банка, %","",0,100,true,true)+numberField("fee","Разовые расходы, ₽","",0,maxAmount)+
        '<p class="hint">Укажите расходы, которые оплачиваются отдельно.</p><button class="primary" type="submit">Сравнить</button></form>');
      break;
    case "early":
      modal("Досрочное погашение",'<p>Частичное погашение может уменьшить будущий платёж или срок. Дата, порядок списания и доступные варианты зависят от договора.</p><a href="'+products[state.product].source+'" target="_blank" rel="noopener">Посмотреть условия на сайте банка ↗</a>');
      break;
  }
}

function compareDebt(offer){
  if(!state.payment||!state.remaining){
    modal("Действующий кредит",'<p>Добавьте текущий платёж и оставшийся срок, чтобы сопоставить его с новым графиком.</p><button class="primary" data-back="2" data-debt type="button">Добавить данные</button>');
    return;
  }
  const payment=Number(state.payment);
  const total=payment*Number(state.remaining);
  const monthlyDiff=offer.payment-payment;
  const totalDiff=offer.total-total;
  modal("Сравнение с текущим кредитом",table("Сейчас","Рефинансирование",[
    ["В месяц",money(payment),money(offer.payment)],["Срок",termText(state.remaining),termText(offer.months)],["Всего",money(total),money(offer.total)]
  ])+'<p>'+differenceText("Платёж",monthlyDiff)+' '+differenceText("Общая сумма выплат",totalDiff)+'</p><p class="hint">Для точного сравнения проверьте остаток на дату закрытия.</p>');
}

function differenceText(label,diff){
  return Math.abs(diff)<.5 ? label+" почти совпадает." : label+(diff>0?" выше на ":" ниже на ")+money(Math.abs(diff))+".";
}

function compareInsurance(months){
  const without=estimate(months,false);
  const withOption=estimate(months,true);
  modal("Со страховкой и без неё",'<p>Срок '+termText(months)+'. В расчёте цена страховки добавляется к сумме кредита.</p>'+
    table("Без страховки","Со страховкой",[
    ["Стоимость страховки",money(0),money(withOption.fee)],["Расчётная ставка",percent(without.rate),percent(withOption.rate)],
    ["В месяц",money(without.payment),money(withOption.payment)],["Всего",money(without.total),money(withOption.total)]])+
    '<p>'+differenceText("Со страховкой общая сумма выплат",withOption.total-without.total)+'</p>'+
    '<div class="action-row"><button class="outline" data-insurance="no" type="button">Без страховки</button><button class="outline" data-insurance="yes" type="button">Учесть страховку</button></div>');
}

function compareBank(rate,fee){
  const [offer]=calculateOptions();
  const otherPayment=annuity(Number(state.amount),rate,offer.months);
  const otherTotal=otherPayment*offer.months+fee;
  const diff=otherTotal-offer.total;
  const verdict=Math.abs(diff)<.5?"Общая сумма выплат почти совпадает.":(diff<0?"Предложение другого банка":"Расчёт Альфы")+" дешевле на "+money(Math.abs(diff))+" по общей сумме выплат.";
  modal("Сравнение с другим банком",table("Расчёт Альфы","Другой банк",[
    ["Ставка",percent(offer.rate),percent(rate)],["В месяц",money(offer.payment),money(otherPayment)],["Допрасходы",offer.fee?money(offer.fee)+" в кредите":"0 ₽",fee?money(fee)+" отдельно":"0 ₽"],["Всего",money(offer.total),money(otherTotal)]
  ])+'<p>'+verdict+'</p><p class="hint">Сравнение предварительное и предполагает одинаковую сумму и равные ежемесячные платежи.</p>');
}

function updateAmount(amount){
  state.amount=amount;
  document.querySelectorAll("[data-amount]").forEach(button=>button.setAttribute("aria-pressed",String(Number(button.dataset.amount)===Number(amount))));
}

function chooseGoal(product){
  const next=product==="other"?"cash":product;
  if(next!==state.product){
    state.payment="";
    state.remaining="";
  }
  state.product=next;
  state.goal=goals.find(item=>item[0]===product)[1];
  go(2);
}

function submitOpening(form){
  const text=form.elements.opening.value.trim();
  if(!text){form.elements.opening.value="";form.elements.opening.reportValidity();return;}
  const parsed=parseContext(text);
  const product=productForGoal(text);
  if(product!==state.product){
    state.payment="";
    state.remaining="";
  }
  state.product=product;
  state.opening=text;
  state.goal=text;
  if(parsed.amount)state.amount=String(parsed.amount);
  if(parsed.budget)state.budget=String(parsed.budget);
  if(parsed.priority)state.priority=parsed.priority;
  if(parsed.months||parsed.insurance!==undefined)state.context=text;
  go(2);
}

function submitDetails(form){
  const data=new FormData(form);
  for(const name of ["amount","budget","context","payment","remaining"]){
    state[name]=String(data.get(name)??"").trim();
  }
  const error=$("parameter-error");
  const baseline=Number(state.payment)*Number(state.remaining);
  if(state.product==="refi"&&((!!state.payment!==!!state.remaining)||(state.payment&&baseline<Number(state.amount)))){
    error.textContent=baseline?"Проверьте сумму долга и оставшиеся платежи.":"Укажите текущий платёж и оставшийся срок.";
    error.hidden=false;
    return;
  }
  const context=parseContext(state.context);
  if(state.goal==="Другая цель"&&state.context)state.product=productForGoal(state.context);
  if(context.insurance!==undefined)state.insurance=context.insurance;
  go(3);
}

$("navigation").addEventListener("click",()=>go(step-1));
$("close").addEventListener("click",()=>popup.close());
main.addEventListener("input",event=>{
  const {name,value}=event.target;
  if(!Object.hasOwn(state,name))return;
  if(name==="amount")updateAmount(value);
  else state[name]=value;
});
document.addEventListener("click",event=>{
  const button=event.target.closest("button");
  if(!button)return;
  const data=button.dataset;
  if(data.product)chooseGoal(data.product);
  if(data.amount){
    updateAmount(data.amount);
    main.querySelector('[name="amount"]').value=data.amount;
  }
  if(data.priority){
    state.priority=state.priority===data.priority?"":data.priority;
    main.querySelectorAll("[data-priority]").forEach(pill=>pill.setAttribute("aria-pressed",String(pill.dataset.priority===state.priority)));
  }
  if(data.compare)showComparison(data.compare);
  if(data.select){state.selected=Number(data.select);go(4);}
  if(data.back){
    go(Number(data.back));
    if(data.debt!==undefined)main.querySelector('[name="payment"]').closest("details").open=true;
  }
  if(data.insurance){
    state.insurance=data.insurance==="yes";
    go(3);
  }
});
document.addEventListener("submit",event=>{
  const form=event.target;
  event.preventDefault();
  if(form.id==="goal-form")submitOpening(form);
  if(form.id==="parameters-form")submitDetails(form);
  if(form.id==="bank-form")compareBank(Number(form.elements.rate.value),Number(form.elements.fee.value));
});
render(false);
</script>
</body>
</html>
