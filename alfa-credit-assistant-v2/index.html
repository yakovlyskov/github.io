<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Кредитный помощник Альфа-Банка</title>
<meta name="description" content="Подберите кредит, уточните условия и сравните варианты.">
<style>
:root{--paper:#fbf9fa;--ink:#241b22;--dim:#625760;--line:#eae2e7;--rose:#fbeaf0;--red:#a91d46;--dark:#352437;--pale:#f3edf6;--green:#1a6048}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header{background:#fff;border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.shell{width:min(calc(100% - 28px),500px);margin-inline:auto}
.header-row{min-height:55px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-weight:800;white-space:nowrap;display:inline-flex;align-items:center;gap:8px}
.brand b{background:var(--red);color:white;border-radius:9px;width:29px;height:29px;display:grid;place-items:center;font-size:17px}
main{margin-top:17px;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
h1,h2,h3,p{margin:0}
h1{font-size:clamp(25px,7.2vw,36px);line-height:1.12;letter-spacing:-.047em;margin-bottom:5px}
h2{font-size:19px;line-height:1.25;letter-spacing:-.025em}
h3{font-size:15px}
small,.muted{color:var(--dim)}
.lead{color:var(--dim);font-size:14px;margin-bottom:12px}
.stack{display:grid;gap:9px}
.card{background:white;border:1px solid var(--line);border-radius:16px;padding:12px}
.controls{display:grid;gap:9px}
.control-head{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700}
.input,.control-head input[type=number]{font:inherit;min-width:0;min-height:44px;padding:6px 9px;border:1px solid #e7dbe3;border-radius:9px;background:#fff;color:var(--ink);font-size:16px}
.control-head input[type=number]{width:110px;text-align:right;font-weight:750}
.input{width:100%}
.range{display:block;width:100%;margin:0;height:23px;accent-color:var(--red);cursor:pointer}
.range-ends{display:flex;justify-content:space-between;color:var(--dim);font-size:11px}
fieldset{margin:0;padding:0;border:0;min-inline-size:0}
legend{padding:0}
button,summary,select{font:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #a563a3;outline-offset:2px}
a{color:var(--red);text-underline-offset:3px}
.btn{min-height:44px;display:inline-flex;align-items:center;justify-content:center;text-align:center;padding:7px 10px;border-radius:11px;font-weight:730;font-size:13px;line-height:1.2;text-decoration:none}
.primary{background:var(--red);border:1px solid var(--red);color:white}
.primary:hover{background:#881333}
.secondary{border:1px solid #e6dae3;background:white;color:var(--dark)}
.secondary:hover,.tag:hover{background:var(--rose);border-color:#dca8b9}
.quiet{background:none;border:0;color:var(--red);min-height:44px;padding:5px 2px;font-size:13px;font-weight:750}
.quiet:hover{text-decoration:underline}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.tag{min-height:44px;border:1px solid var(--line);background:white;color:var(--dark);border-radius:9px;font-size:13px;font-weight:690;padding:5px 8px}
.tag[aria-pressed=true]{color:var(--red);border-color:#c56b88;background:var(--rose)}
.full{width:100%}
.catalog-entry,.catalog-item{width:100%;min-height:48px;display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--line);border-radius:11px;padding:6px 9px;background:#fff;color:var(--ink);font:inherit;text-decoration:none;text-align:left}
.catalog-entry{background:var(--pale);border-color:#e4d8e7}
.catalog-entry:hover,.catalog-item:hover{background:var(--rose);border-color:#dca8b9}
.catalog-text{display:grid;gap:1px;min-width:0;line-height:1.25}
.catalog-text small{font-size:12px;color:var(--dim)}
.catalog-arrow{flex:0 0 auto;color:var(--red);font-weight:750}
.catalog-group{display:grid;gap:5px}
.catalog-group h3{margin:4px 0 1px;color:var(--dim);font-size:13px}
.first-actions{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.intent-grid{margin-top:6px}
.intent{display:flex;gap:6px;align-items:center;min-height:44px;border:1px solid var(--line);border-radius:10px;padding:6px 7px;font-size:13px;font-weight:690;cursor:pointer}
.intent:has(input:checked){background:var(--rose);border-color:#c56b88;color:var(--red)}
.intent input{accent-color:var(--red);flex:0 0 auto;margin:0}
.intent span{min-width:0;overflow-wrap:anywhere}
.ask-link{justify-self:start;margin-block:-5px}
.btn[aria-pressed=true]{color:var(--red);border-color:#c56b88;background:var(--rose)}
#debt-questions legend{margin-bottom:4px}
#picker-form + .hint{margin-top:9px}
#picker-form legend{font-weight:700}
#picker-form details summary{min-height:44px}
.extra-intents{margin-top:5px}
.result-label{color:var(--red);font-size:12px;font-weight:750}
#offers-form legend{padding-inline:4px;font-size:13px;font-weight:750}
.quote{display:grid;gap:7px;border-color:#dcb6c4;background:#fff9fb}
.quote-label{display:flex;align-items:center;justify-content:space-between;gap:4px;flex-wrap:wrap;color:var(--dim);font-size:12px}
.payment{font-size:clamp(27px,8vw,35px);line-height:1.05;font-weight:820;letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.payment small{font-size:13px;font-weight:600;letter-spacing:0}
.metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin:0}
.metrics > div{display:grid;gap:1px;min-width:0}
.metrics dt{font-size:12px;color:var(--dim)}
.metrics dd{margin:0;font-weight:780;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.signal{padding:6px 8px;border-radius:8px;background:#fff0e0;color:#743d1d;font-size:12px}
.signal.good{background:#eaf5ef;color:var(--green)}
.details summary{display:flex;align-items:center;gap:8px;min-height:44px;cursor:pointer;font-weight:700;color:var(--dark);list-style:none}
.details summary::-webkit-details-marker{display:none}
.details summary:before{content:"+";text-align:center;width:18px;flex:0 0 18px}
.details[open] summary:before{content:"−"}
.field{display:grid;gap:3px;font-size:13px;font-weight:700;color:var(--dim)}
.hint{color:var(--dim);font-size:12px}
.context-note{font-size:13px;color:var(--dim)}
.help-form{display:grid;gap:6px;margin-top:7px}
.line{height:1px;background:var(--line)}
dialog{width:min(calc(100% - 20px),480px);max-height:calc(100dvh - 35px);padding:13px;border:1px solid var(--line);border-radius:16px;color:var(--ink);box-shadow:0 18px 60px #33182a35}
dialog::backdrop{background:#331e2a70}
.dialog-head{display:flex;align-items:center;justify-content:space-between;gap:7px;margin-bottom:8px}
.close{width:44px;height:44px;flex:0 0 44px;border:0;border-radius:9px;background:var(--pale);color:var(--ink);font-size:22px}
.compare{border-collapse:collapse;table-layout:fixed;width:100%;font-size:12px}
.compare th,.compare td{padding:7px 3px;border-bottom:1px solid var(--line);text-align:left;overflow-wrap:anywhere}
.compare td{font-weight:720}
.compare tr:last-child{background:#fbf2f6}
dl.breakdown{margin:0;display:grid;gap:6px}
.breakdown div{display:flex;gap:10px;justify-content:space-between}
.breakdown dd{margin:0;font-weight:760;text-align:right}
.error{color:#95193d;font-size:13px}
[hidden]{display:none!important}
@media(max-width:360px){.shell{width:calc(100% - 20px)}main{margin-top:11px}.lead{font-size:13px;margin-bottom:9px}.card{padding:9px}.controls{gap:6px}.header-row{min-height:48px}}
</style>
</head>
<body>
<header><div class="shell header-row"><div class="brand"><b aria-hidden="true">✦</b>Альфа-Банк</div><button id="nav" class="quiet" type="button" data-act="loan">Мой кредит</button></div></header>
<main id="app" class="shell"></main>
<dialog id="modal" aria-labelledby="modal-title"><div class="dialog-head"><h2 id="modal-title" tabindex="-1"></h2><button class="close" type="button" data-act="close" aria-label="Закрыть">×</button></div><div id="modal-body" class="stack"></div></dialog>
<script>
"use strict";
const $ = id => document.getElementById(id);
const products = {
  cash:{name:"Кредит наличными",rate:55.39,tariff:"https://alfabank.ru/get-money/credit/credit-cash/",source:"https://alfabank.ru/get-money/credit/credit-cash/"},
  refi:{name:"Рефинансирование",rate:55.39,tariff:"https://alfabank.ru/get-money/credit/refinancing/calculator/",source:"https://alfabank.ru/get-money/credit/refinancing/"},
  auto:{name:"Кредит наличными на автомобиль",rate:55.39,tariff:"https://alfabank.ru/get-money/credit/calculator/autocredit/",source:"https://alfabank.ru/get-money/autocredit/"}
};
const formatMoney = new Intl.NumberFormat("ru-RU",{maximumFractionDigits:0});
const formatRate = new Intl.NumberFormat("ru-RU",{maximumFractionDigits:2});
const money = value => formatMoney.format(value)+" ₽";
const percent = value => formatRate.format(value)+"%";
const termText = months => months+" мес.";
const esc = value => String(value ?? "").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[char]);
const normalize = text => text.toLowerCase().replaceAll("ё","е");
function annuity(principal,rate,months){
  const monthlyRate=rate/1200;
  return monthlyRate ? principal*monthlyRate/(1-(1+monthlyRate)**-months) : principal/months;
}

function estimate(months,{amount,product}=state){
  const rate=products[product].rate;
  const payment=annuity(amount,rate,months);
  return {months,rate,payment,total:payment*months,over:payment*months-amount};
}
function productForGoal(text){
  const value=normalize(text);
  if(/рефинанс|(?:закры|погас).{0,18}(?:кредит|долг|карт)/.test(value))return "refi";
  if(/машин|автомобил|автокредит/.test(value))return "auto";
  return "cash";
}

function parseContext(text){
  const value=normalize(text);
  const found={};
  const amounts=/(\d{1,3}(?:[ \u00a0\u202f]\d{3})+|\d+(?:[,.]\d+)?)\s*(млн|тыс(?:яч[аи]?)?\.?|[кk](?![а-яa-z]))?/giu;
  for(const match of value.matchAll(amounts)){
    const unit=match[2];
    const raw=Number(match[1].replace(/\s/g,"").replace(",","."));
    const amount=Math.round(raw*(unit==="млн"?1e6:unit?1e3:1));
    const before=value.slice(Math.max(0,match.index-38),match.index);
    const after=value.slice(match.index+match[0].length).trimStart();
    if(!unit&&/^(?:год[а-я]*|лет(?:$|[\s,.])|мес)/.test(after)){
      const months=raw*(after.startsWith("мес")?1:12);
      if(Number.isInteger(months)&&months>=12&&months<=60)found.months=months;
    }else if(/(?:плат[её]ж[а-я]*|ежемесячно)\s*(?:до|не больше|около|в)?\s*$/.test(before)||/^(?:₽|руб\.?\s*)?\s*(?:в\s+месяц|ежемесячно)/.test(after)){
      if(amount>=1&&amount<=maxAmount)found.budget=amount;
    }else if(amount>=30000&&amount<=maxAmount&&found.amount===undefined){
      found.amount=amount;
    }
  }
  if(/меньше.{0,10}переплат|снизить.{0,10}переплат/.test(value))found.priority="total";
  if(/меньше.{0,10}платеж|снизить.{0,10}платеж|платеж.{0,10}пониже/.test(value))found.priority="payment";
  if(/без\s+страхов/.test(value))found.insurance=false;
  else if(/со\s+страхов/.test(value))found.insurance=true;
  return found;
}

const productGoals={cash:"Любая цель",auto:"Автомобиль",refi:"Погасить кредит"};
const creditCatalog=[
  {heading:"Разовая сумма или деньги на покупки",items:[
    {id:"cash",name:products.cash.name,desc:"Разовая сумма с графиком платежей",apply:true},
    {key:"payday",name:"Деньги до зарплаты",desc:"Кредит для небольшой суммы",url:"https://alfabank.ru/get-money/credit/do-zarplaty/",apply:true,note:"По опубликованным условиям срок начинается от года. Если деньги нужны на несколько дней, уточните порядок и расходы при досрочном погашении."},
    {key:"on-hand",name:"Деньги под рукой",desc:"Проверьте предложение в приложении",private:true},
    {key:"any-goal",name:"Деньги на любые цели",desc:"Проверьте предложение в приложении",private:true},
    {key:"limit-cash",name:"Наличные из доступного лимита",desc:"Проверьте, можно ли использовать ваш лимит для получения наличных",private:true,note:"Уточните комиссию и условия начисления процентов до операции."},
    {key:"better-cash",name:"Выгодные наличные",desc:"Проверьте предложение в приложении",private:true},
    {key:"purchase-plan",name:"Рассрочка на покупки",desc:"Оплата покупки частями, если доступно по условиям карты",url:"https://alfabank.ru/help/articles/credit-cards/rassrochka-po-kreditnoj-karte-v-alfa-banke/",note:"Проверьте, какие покупки подходят, срок рассрочки и общую сумму выплат."},
    {key:"cards",name:"Кредитная карта",desc:"Возобновляемый лимит для повторных покупок",url:"https://alfabank.ru/get-money/credit-cards/",apply:true,note:"Лимитом можно пользоваться снова по мере погашения. Сверьте тариф карты и условия льготного периода."},
    {key:"grace-150",name:"Карта с льготным периодом до 150 дней",desc:"Условия зависят от тарифа карты",url:"https://alfabank.ru/news/t/release/alfa-bank-vipustil-kreditnuyu-kartu-150-dnei-bez-protsentov/",private:true,note:"Проверьте в приложении, доступен ли переход по вашей карте и какие операции входят в льготный период."},
    {key:"education",name:"Кредит на обучение",desc:"Оплата учёбы или курсов",url:"https://alfabank.ru/get-money/credit/na-obuchenie/",apply:true}
  ]},
  {heading:"Жильё, автомобиль и залог",items:[
    {key:"mortgage",name:"Ипотека",desc:"На покупку жилья",url:"https://alfabank.ru/get-money/mortgage/",specialist:true,apply:true,note:"У специалиста можно уточнить тип программы, требования к взносу и объекту."},
    {id:"auto",name:products.auto.name,desc:"Покупка автомобиля без залога авто",apply:true},
    {key:"dealer",name:"Автокредит у дилера",desc:"Покупка машины в автосалоне",url:"https://alfabank.ru/get-money/auto-loan/dealers/",apply:true},
    {key:"property",name:"Кредит под залог недвижимости",desc:"Деньги под залог уже имеющейся недвижимости",url:"https://alfabank.ru/get-money/credit/pod-zalog/",specialist:true,apply:true},
    {key:"car-pledge",name:"Кредит под залог автомобиля",desc:"Деньги под залог уже имеющегося автомобиля",url:"https://alfabank.ru/retail/tariffs/tab3/",specialist:true,note:"По вашему автомобилю нужен расчёт специалиста."}
  ]},
  {heading:"Действующие кредиты",items:[
    {id:"refi",name:"Рефинансирование кредитов в других банках",desc:"Новый график для погашения действующих кредитов",apply:true},
    {key:"mortgage-refi",name:"Рефинансирование ипотеки",desc:"Пересмотр условий действующей ипотеки",url:"https://alfabank.ru/get-money/mortgage/kalkulyator-refin-ipoteki/",specialist:true,apply:true},
    {key:"alfa-refi",name:"Переоформление кредита Альфа-Банка",desc:"Уточните возможность изменить условия своего кредита",private:true,specialist:true},
    {key:"lower-card",name:"Снизить платёж по кредитной карте",desc:"Рассрочка на долг по карте Альфа-Банка",url:"https://alfabank.ru/help/articles/credit-cards/rassrochka-po-kreditnoj-karte-v-alfa-banke/",private:true},
    {key:"card-transfer",name:"Рефинансирование кредитной карты другого банка",desc:"Перевод задолженности с карты другого банка",url:"https://alfabank.ru/help/articles/credit-cards/pogasit-kreditku-drugoy-kreditkoy/",note:"Проверьте доступность услуги, требования к прежней карте, сроки её закрытия и стоимость перевода."},
    {key:"refi-pledge",name:"Рефинансирование под залог недвижимости",desc:"Погашение кредитов с обеспечением",url:"https://alfabank.ru/get-money/credit/refinansirovanie-pod-zalog/",specialist:true,apply:true}
  ]}
];
const app=$("app");
const popup=$("modal");
const maxAmount=7500000;
const state={page:"calc",product:"cash",amount:150000,months:24,budget:0,goal:"",loan:{balance:150000,payment:11500,remaining:15,date:"2026-12-15"}};
const integer=(value,min,max)=>Number.isInteger(value)&&value>=min&&value<=max;
const clamp=(value,min,max)=>Math.max(min,Math.min(max,value));
const loanTotal=()=>state.loan.payment*state.loan.remaining;
const monthFormat=new Intl.DateTimeFormat("ru-RU",{day:"numeric",month:"long",timeZone:"UTC"});
const formatDate=date=>date?monthFormat.format(new Date(date+"T12:00:00Z")):"Укажите дату";

function heading(title,lead){
  return '<h1 id="heading" tabindex="-1">'+title+'</h1><p class="lead">'+lead+'</p>';
}
function field(name,label,value,min,max,extra=""){
  return '<label class="field">'+label+'<input class="input" type="number" inputmode="numeric" name="'+name+'" value="'+esc(value)+'" min="'+min+'" max="'+max+'" '+extra+'></label>';
}
function btn(action,label,variant="secondary"){
  return '<button class="btn '+variant+'" type="button" data-act="'+action+'">'+label+'</button>';
}
function breakdownRow(label,value){
  return "<div><dt>"+label+"</dt><dd>"+value+"</dd></div>";
}
function modal(title,body){
  $("modal-title").textContent=title;
  $("modal-body").innerHTML=body;
  if(!popup.open)popup.showModal();
  popup.scrollTop=0;
  $("modal-title").focus({preventScroll:true});
}
function show(page){
  if(popup.open)popup.close();
  state.page=page;
  render(true);
}
function render(focus=false){
  const views={calc:calculator,loan:loanScreen,picker:pickerScreen,matches:matchesScreen,product:productDetail,support:supportScreen};
  app.innerHTML=views[state.page]();
  const nav=$("nav");
  const navActions={calc:["Мой кредит","loan"],matches:["← К вопросам","picker"],product:["← Назад","product-back"],support:["← Назад","support-back"]};
  const [label,destination]=navActions[state.page]??["← К расчёту","calc"];
  nav.textContent=label;
  nav.dataset.act=destination;
  if(state.page==="calc")sync();
  if(state.page==="picker")togglePickerQuestions();
  if(focus){
    window.scrollTo(0,0);
    $("heading").focus({preventScroll:true});
  }
}

function controls(){
  return '<section class="card controls" aria-label="Параметры кредита">'+
    '<div><div class="control-head"><label for="amount">Сумма на руки, ₽</label><input id="amount" type="number" inputmode="numeric" min="30000" max="'+maxAmount+'" value="'+state.amount+'"></div>'+
    '<input class="range" id="amount-range" type="range" min="30000" max="1000000" step="1000" aria-label="Изменить сумму"><div class="range-ends"><span>30 тыс. ₽</span><span id="range-max">1 млн ₽</span></div></div>'+
    '<div><div class="control-head"><label for="months">Срок, месяцев</label><input id="months" type="number" inputmode="numeric" min="12" max="60" value="'+state.months+'"></div>'+
    '<input class="range" id="months-range" type="range" min="12" max="60" step="1" aria-label="Изменить срок"><div class="range-ends"><span>1 год</span><span>5 лет</span></div></div></section>';
}
function result(){
  return '<section class="card quote" aria-label="Предварительный расчёт"><div class="quote-label"><span id="product-label">'+products[state.product].name+'</span><span>Предварительно</span></div>'+
    '<div><p class="hint">Ежемесячный платёж</p><p class="payment" id="monthly"></p></div>'+
    '<dl class="metrics"><div><dt>Верхняя опубликованная ставка</dt><dd id="rate"></dd></div><div><dt>Сумма на руки</dt><dd id="quote-amount"></dd></div><div><dt>Переплата</dt><dd id="over"></dd></div><div><dt>Всего выплатите</dt><dd id="total"></dd></div></dl>'+
    '<p class="signal" id="budget-note" hidden></p><p class="hint">Ориентир без дополнительных расходов. Индивидуальные условия и ПСК покажет банк. <a id="tariff-source" target="_blank" rel="noopener">Источник ставки ↗</a></p></section>';
}
function calculator(){

function updateContext(form){
  const value=form.elements.context.value.trim();
  if(hasPersonalData(value)){
    $("context-feedback").textContent="Удалите личные данные. Для расчёта достаточно суммы, срока и цели.";
    return;
  }
  const reason=supportReason(value);
  if(reason){showSupport(reason);return;}
  const parsed=parseContext(value);
  const notes=[];
  if(parsed.amount){state.amount=parsed.amount;notes.push("сумма "+money(parsed.amount))}
  if(parsed.months){state.months=parsed.months;notes.push("срок "+termText(parsed.months))}
  if(parsed.budget){state.budget=parsed.budget;notes.push("платёж до "+money(parsed.budget))}
  if(parsed.insurance===false)notes.push("ориентир без стоимости дополнительных услуг");
  const goal=productForGoal(value);
  if(goal!=="cash"){
    state.product=goal;
    state.goal=goal==="auto"?"Автомобиль":"Погасить кредит";
    for(const tag of app.querySelectorAll("[data-goal]"))tag.setAttribute("aria-pressed",String(tag.dataset.goal===goal));
    notes.push("цель — "+state.goal.toLowerCase());
  }
  if(parsed.priority==="payment"&&!parsed.months){
    state.months=Math.min(60,state.months+12);notes.push("увеличили срок для снижения платежа");
  }
  if(parsed.priority==="total"&&!parsed.months){
    state.months=Math.max(12,state.months-12);notes.push("сократили срок для снижения переплаты");
  }
  $("context-feedback").textContent=notes.length?"Учли: "+notes.join(", ")+".":"Можно указать сумму, срок, желаемый платёж или условие по страховке.";
  sync();
  if(parsed.insurance===true)insurance();
}

    }else if(p.debtType==="loan"){
      if(outside&&amount>=minCalcAmount&&amount<=30000000&&band<=10)out.push(pick("refi","Рефинансирование предназначено для кредитов в других банках.",debtCheck));
      if(inside&&band<=10)out.push(pick("alfa-refi","Для потребительского кредита Альфа-Банка имеет смысл проверить возможность переоформления.",debtCheck,true));
      if(outside&&p.collateral==="property"&&amount>=500000&&amount<=30000000&&band<=10)out.push(pick("refi-pledge","Вы готовы рассмотреть залог недвижимости для рефинансирования.","Сравните итоговую стоимость с учётом расходов на залог.",true));
    }
  }else if(p.usage==="repeat"){
    if(amount<=maxAmount&&short)out.push(cards);
    if(goal==="shop"&&short&&amount<=maxAmount)out.push(installments);
  }else{
    if(goal==="study"&&canUseQuick)out.push(pick("education","Банк предлагает кредит для оплаты учёбы и курсов.","Сравните график и общую стоимость с кредитом наличными."));
    if(goal==="payday"&&amount>=minCalcAmount&&amount<=100000&&(!p.requestedTerm||band===1)){
      out.push(pick("payday","Можно проверить условия продукта для небольшой суммы.","На сайте срок начинается от года. Если деньги нужны на несколько дней, проверьте условия и расходы при досрочном погашении.",true));
    }
    if(goal==="shop"&&short&&amount<=maxAmount)out.push(installments);
    if(canUseQuick)out.push(cash);
    if(secured)out.push(secured);
  }
  return out.slice(0,2);
}

function handlePicker(form){
  const data=new FormData(form);
  const customGoal=String(data.get("customGoal")).trim();
  if(hasPersonalData(customGoal)){
    $("picker-error").textContent="Удалите телефон, номер документа или другие личные данные. Достаточно описания цели.";
    $("picker-error").hidden=false;
    return;
  }
  const goal=String(data.get("intent")??"");
  if(!goal&&!customGoal){
    $("picker-error").textContent="Выберите цель или опишите её своими словами.";
    $("picker-error").hidden=false;
    return;
  }
  profile.goal=goal||"other";
  profile.customGoal=customGoal;
  profile.amount=Number(data.get("requested"));
  profile.budget=Number(data.get("comfort"));
  for(const key of ["requestedTerm","usage","seller","down","homeDown","collateral","lender","debtType","difficulty"]){
    profile[key]=String(data.get(key)??"");
  }
  const concern=supportReason(customGoal);
  if(profile.difficulty==="yes"||concern==="hardship"){
    showSupport("hardship");
    return;
  }
  if(concern){
    showSupport(concern);
    return;
  }
  if(profile.goal==="other"){
    const value=normalize(customGoal);
    const detected=[["refi",/рефинанс|(?:погас|закры).{0,22}(?:кредит|долг|займ|карт)|(?:ден[ье]г|нужн).{0,30}(?:на|закрыть).{0,15}(?:кредит|долг|займ)/],
      ["home",/ипотек|покуп.{0,18}(?:квартир|жиль|дом)|купить (?:квартир|жиль|дом)/],["auto",/машин|автомобил/],
      ["study",/обучен|образован|курс|учеб/],["payday",/до зарплат/],["shop",/покупк|рассроч/]]
      .find(([,pattern])=>pattern.test(value))?.[0];
    if(detected){
      profile.goal=detected;
      if(["home","auto","refi"].includes(detected)){
        show("picker");
        return;
      }
    }
  }
  show("matches");
}

function supportReason(text){
  const value=normalize(text);
  if(/(?:нет|не хватает).{0,17}(?:денег|средств).{0,25}(?:на платеж|платить|погас)|нечем плат|не (?:могу|смогу|могу уже|успеваю|смог) (?:внести|оплатить|заплатить|платить|погасить)|просроч|пропуст.{0,15}платеж|не потян.{0,20}платеж/.test(value))return "hardship";
  if(/жалоб|жалуюсь|мошен|списали ошибочно|незакон|плохой сервис/.test(value))return "complaint";
  if(/живого|оператор|позовите|поговорить с (?:человеком|сотрудник)|поддержк/.test(value))return "requested";
  if(/(?:личн|мо[яию]|индивидуальн|персональн).{0,25}(?:ставк|услови|решени)|(?:рассчита|расчет|одобрят|подойдет|подходят|примут|могу ли заложить).{0,35}(?:ипотек|залог|квартир)|(?:ипотек|залог).{0,30}(?:для меня|мне|оценк|услови|сколько|ставк)/.test(value))return "personal";
  return "";
}
function hasPersonalData(text){
  return /\+?\d(?:[\s().-]*\d){9,}|[\w.+-]+@[\w.-]+\.[a-zа-я]{2,}|(?:паспорт|снилс|инн|код из смс).{0,12}\d{4}/i.test(text);
}

function reply(topic){
  unanswered=0;
  showAsk(topic.answer,topic.url,true);
}
function handleQuestion(text){
  if(hasPersonalData(text)){
    showAsk("Удалите личные данные и повторите вопрос. Для ответа по общим условиям они не нужны.");
    return;
  }
  const reason=supportReason(text);
  if(reason){
    showSupport(reason);
    return;
  }
  const value=normalize(text);
  const specific=/\b\d{2,}\b/.test(value)&&!(/150.{0,6}дн|дн.{0,6}150/.test(value));
  const byId=id=>faq.find(item=>item.id===id);
  const topic=/льгот|грейс|беспроцент|150/.test(value)?byId("grace"):
    specific?null:faq.find(item=>item.pattern.test(value));
  if(topic){
    reply(topic);
    return;
  }
  unanswered++;
  if(unanswered>=2){
    showSupport("unknown");
    return;
  }
  showAsk("У меня нет подтверждённого ответа. Попробуйте уточнить вопрос или спросите оператора.","",false,true);
}

function showOfferComparison(form){
  const values=new FormData(form);
  const a={payment:Number(values.get("monthly1")),total:Number(values.get("total1"))};
  const b={payment:Number(values.get("monthly2")),total:Number(values.get("total2"))};
  if(a.payment>a.total||b.payment>b.total){
    const error=$("offer-error");
    error.textContent="Ежемесячный платёж больше общей суммы выплат. Проверьте поля.";
    error.hidden=false;
    return;
  }
  const within=offer=>!offerScope.budget||offer.payment<=offerScope.budget;
  const cheaper=a.total===b.total?null:a.total<b.total?1:2;
  const fits=[a,b].flatMap((offer,i)=>within(offer)?[i+1]:[]);
  const difference=cheaper?'Меньше всего выплатите по предложению '+cheaper+'. Разница — '+money(Math.abs(a.total-b.total))+'.':'Общая сумма выплат одинаковая.';
  let budget="";
  if(offerScope.budget){
    if(!fits.length)budget="Оба платежа выше вашего ориентира.";
    else if(fits.length===1)budget="В ваш месячный ориентир укладывается только предложение "+fits[0]+".";
    else budget="Оба платежа укладываются в ваш ориентир.";
  }
  modal("Результат сравнения",columns("Вариант 1","Вариант 2",[
    ["В месяц",money(a.payment),money(b.payment)],["Переплата",money(a.total-offerScope.amount),money(b.total-offerScope.amount)],["К выплате",money(a.total),money(b.total)]
  ])+'<p><strong>'+difference+'</strong></p>'+(budget?'<p>'+budget+'</p>':"")+
    '<p class="hint">По введённым вами условиям. Отдельно проверьте залог, дополнительные услуги и правила досрочного погашения.</p>'+btn("offers","Сравнить другие условия"));
}

      state.amount=profile.amount;
      state.budget=profile.budget;
      if(profile.requestedTerm==="1")state.months=12;
    }
    show("calc");
  }
  if(topicId)reply(faq.find(item=>item.id===topicId));
  if(feedback&&button.getAttribute("aria-pressed")!=="true"){
    const group=button.closest("[data-rating-group]");
    const previous=group.querySelector('[aria-pressed="true"]')?.dataset.feedback;
    for(const choice of group.querySelectorAll("button"))choice.setAttribute("aria-pressed",String(choice===button));
    const note=group.nextElementSibling;
    note.textContent=feedback==="like"?"Спасибо за оценку.":"Спасибо за оценку. Можете уточнить вопрос у оператора.";
    note.hidden=false;
    track("answer_rated",{value:feedback,scope,...(previous?{previous}:{})});
  }
});
app.addEventListener("input",event=>{
  const field=event.target;
  if(state.page!=="calc")return;
  const id=field.id;
  if(!["amount","amount-range","months","months-range"].includes(id))return;
  const key=id.startsWith("amount")?"amount":"months";
  const value=Number(field.value);
  if(integer(value,key==="amount"?30000:12,key==="amount"?maxAmount:60)){
    state[key]=value;
    sync();
  }
});
app.addEventListener("change",event=>{
  const field=event.target;
  if(field.name==="intent"&&state.page==="picker")togglePickerQuestions();
  if(state.page!=="calc"||!["amount","months"].includes(field.id))return;
  const value=Number(field.value);
  const min=field.id==="amount"?30000:12;
  const max=field.id==="amount"?maxAmount:60;
  if(integer(value,min,max))return;
  if(field.value&&Number.isFinite(value))state[field.id]=clamp(Math.round(value),min,max);
  field.value=state[field.id];
  sync();
});
document.addEventListener("submit",event=>{
  const form=event.target;
  event.preventDefault();
  if(form.id==="ask-form")handleQuestion(form.elements.question.value.trim());
  if(form.id==="picker-form")handlePicker(form);
  if(form.id==="offers-form")showOfferComparison(form);
  if(form.id==="context-form")updateContext(form);
  if(form.id==="bank-form")compareBank(Number(form.elements.rate.value),Number(form.elements.fee.value));
  if(form.id==="loan-form"){
    const data=new FormData(form);
    const loan={balance:Number(data.get("balance")),payment:Number(data.get("payment")),remaining:Number(data.get("remaining")),date:String(data.get("date")),custom:true};
    if(loan.payment*loan.remaining<loan.balance){
      $("loan-error").textContent="Оставшиеся платежи меньше остатка долга. Проверьте введённые суммы.";
      $("loan-error").hidden=false;
      return;
    }
    state.loan=loan;
    render(true);
  }
});
render();
</script>
</body>
</html>
